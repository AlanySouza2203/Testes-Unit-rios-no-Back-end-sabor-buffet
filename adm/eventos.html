<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sabor & Arte - Eventos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Inter', sans-serif;
    }

    :root{
      --bg:#020617;
      --sidebar:#0f172a;
      --card:#111827;

      --text:#e2e8f0;
      --muted:#94a3b8;

      --yellow:#facc15;
      --green:#22c55e;
      --orange:#fb923c;
      --red:#ef4444;

      --border:rgba(255,255,255,0.06);

      --radius:18px;
    }

  body{
    background:var(--bg);
    color:var(--text);
    overflow:hidden; /* tira scroll do body */
}

/* MUITO IMPORTANTE */
.container{
    display:flex;
    height:100vh;
}

/* SIDEBAR fixa */
.sidebar{
    width:260px;
    min-width:260px;
    height:100vh;

    background:var(--sidebar);
    border-right:1px solid var(--border);

    padding:24px 18px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

/* CONTENT AO LADO */
.content{
    flex:1;
    height:100vh;

    padding:30px;

    overflow-y:auto;
    overflow-x:hidden;
}

/* BARRA DE ROLAGEM */
.content::-webkit-scrollbar{
    width:10px;
}

.content::-webkit-scrollbar-track{
    background:#0f172a;
}

.content::-webkit-scrollbar-thumb{
    background:#facc15;
    border-radius:30px;
}

.content::-webkit-scrollbar-thumb:hover{
    background:#eab308;
}

    /* SIDEBAR */

    .sidebar{
      width:260px;
      background:var(--sidebar);
      border-right:1px solid var(--border);

      padding:24px 18px;

      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .sidebar-top{
      display:flex;
      flex-direction:column;
    }

    .logo{
      font-size:28px;
      font-weight:800;
      margin-bottom:40px;
      color:white;
    }

    .logo span{
      color:var(--yellow);
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .menu a{
      display:flex;
      align-items:center;
      gap:12px;

      text-decoration:none;

      color:var(--muted);

      padding:14px 16px;

      border-radius:14px;

      transition:0.2s;

      font-size:15px;
      font-weight:500;
    }

    .menu a svg{
      width:19px;
      height:19px;
    }

    .menu a:hover{
      background:rgba(250,204,21,0.08);
      color:white;
    }

    .menu a.active{
      background:var(--yellow);
      color:black;
      font-weight:700;
    }

    .sidebar-footer{
      display:flex;
      flex-direction:column;
      gap:12px;
      padding-top:20px;
    }

    .sidebar-footer a{
      display:flex;
      align-items:center;
      gap:12px;

      text-decoration:none;

      color:var(--muted);

      padding:14px 16px;

      border-radius:14px;

      transition:0.2s;

      font-size:15px;
      font-weight:500;
    }

    .sidebar-footer a svg{
      width:18px;
      height:18px;
    }

    .sidebar-footer a:hover{
      background:rgba(255,255,255,0.05);
      color:white;
    }

    /* CONTENT */

    .content{
      flex:1;
      padding:30px;
      overflow-y:auto;
    }

    .topo{
      display:flex;
      justify-content:space-between;
      align-items:center;

      margin-bottom:25px;
    }

    .titulo h1{
      font-size:36px;
      margin-bottom:6px;
    }

    .titulo p{
      color:var(--muted);
      font-size:15px;
    }

    .btn{
      background:var(--yellow);
      border:none;

      padding:14px 20px;

      border-radius:14px;

      cursor:pointer;

      font-weight:700;

      display:flex;
      align-items:center;
      gap:8px;

      transition:0.2s;

      color:black;
    }

    .btn:hover{
      transform:scale(1.03);
    }

    /* EVENTOS */

    .eventos-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
      gap:20px;
    }

    .evento{
      background:var(--card);

      border:1px solid var(--border);

      border-radius:24px;

      padding:22px;

      transition:0.2s;
    }

    .evento:hover{
      transform:translateY(-3px);
    }

    .evento-topo{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;

      margin-bottom:18px;
    }

    .evento-info{
      display:flex;
      gap:14px;
    }

    .evento-icone{
      width:50px;
      height:50px;

      border-radius:14px;

      background:rgba(250,204,21,0.12);

      color:var(--yellow);

      display:flex;
      align-items:center;
      justify-content:center;
    }

    .evento small{
      color:var(--muted);
    }

    .evento h3{
      margin-top:12px;
      margin-bottom:16px;
      font-size:24px;
    }

    .evento p{
      color:var(--muted);
      margin-bottom:10px;

      display:flex;
      align-items:center;
      gap:8px;

      font-size:14px;
    }

    .status{
      padding:6px 12px;

      border-radius:999px;

      font-size:12px;
      font-weight:700;
    }

    .confirmado{
      background:rgba(34,197,94,0.15);
      color:var(--green);
    }

    .pendente{
      background:rgba(251,146,60,0.15);
      color:var(--orange);
    }

    .planejado{
      background:rgba(250,204,21,0.15);
      color:var(--yellow);
    }

    .acoes{
      display:flex;
      gap:10px;
      margin-top:20px;
    }

    .btn-secundario{
      flex:1;

      background:#1e293b;

      border:none;

      color:white;

      padding:12px;

      border-radius:12px;

      cursor:pointer;

      font-weight:600;

      transition:0.2s;
    }

    .btn-secundario:hover{
      opacity:0.9;
    }

    .btn-remover{
      background:rgba(239,68,68,0.15);
      color:var(--red);
    }

    .empty{
      text-align:center;
      margin-top:120px;
      color:var(--muted);
    }

    /* MODAL */

    .modal{
      position:fixed;
      inset:0;

      background:rgba(0,0,0,0.7);

      display:none;
      align-items:center;
      justify-content:center;

      z-index:999;
    }

    .modal-content{
      width:100%;
      max-width:420px;

      background:var(--card);

      border:1px solid var(--border);

      border-radius:24px;

      padding:24px;
    }

    .modal-content h3{
      margin-bottom:20px;
      font-size:24px;
    }

    .modal-content input,
    .modal-content select{
      width:100%;

      background:#0f172a;

      border:1px solid var(--border);

      color:white;

      padding:14px;

      border-radius:12px;

      margin-bottom:14px;

      outline:none;
    }

    .modal-botoes{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    .cancelar{
      background:#1e293b;
      color:white;
    }

    
    /* =========================
   MENU MOBILE
========================= */

.menu-mobile{

  position:fixed;
  top:20px;
  left:20px;

  width:55px;
  height:55px;

  border:none;
  border-radius:14px;

  background:var(--yellow);
  color:#000;

  font-size:30px;

  display:none;

  z-index:9999;

  cursor:pointer;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:900px){

  .menu-mobile{
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .sidebar{

    position:fixed;

    top:0;
    left:-270px;

    width:260px;
    height:100vh;

    background:var(--sidebar);

    transition:0.3s;

    z-index:9998;

    overflow-y:auto;
  }

  .sidebar.ativo{
    left:0 !important;
  }

  .content{
    width:100%;
    padding:20px;
    padding-top:90px;
  }

  .topo{
    flex-direction:column;
    align-items:flex-start;
    gap:18px;
  }

  .titulo h1{
    font-size:32px;
  }

  .eventos-grid{
    grid-template-columns:1fr;
  }

  .modal-content{
    width:90%;
  }
}

  </style>
</head>

<body>
  <button class="menu-mobile" onclick="toggleMenu()">
  <i class="bi bi-list"></i>
</button>

<div class="container">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-top">

      <div class="logo">
        Sabor<span>&Arte</span>
      </div>

      <nav class="menu">

        <a href="dashboard.html">
          <i data-lucide="layout-dashboard"></i>
          Dashboard
        </a>

        <a href="clientes.html">
          <i data-lucide="users"></i>
          Clientes
        </a>

        <a href="servicos.html">
          <i data-lucide="utensils-crossed"></i>
          Serviços
        </a>

        <a href="eventos.html" class="active">
          <i data-lucide="calendar"></i>
          Eventos
        </a>

        <a href="pedidos.html">
          <i data-lucide="shopping-bag"></i>
          Pedidos
        </a>

        <a href="orcamentos.html">
          <i data-lucide="file-text"></i>
          Orçamentos
        </a>

      </nav>

    </div>

    <div class="sidebar-footer">

      <a href="#">
        <i data-lucide="panel-left-close"></i>
        Recolher
      </a>

      <a href="../public/login.html">
        <i data-lucide="log-out"></i>
        Sair
      </a>

    </div>

  </aside>

  <!-- CONTENT -->

  <main class="content">

    <div class="topo">

      <div class="titulo">
        <h1>Eventos</h1>
        <p id="quantidadeEventos">0 eventos agendados</p>
      </div>

      <button class="btn" onclick="abrirModal()">
        <i data-lucide="plus"></i>
        Novo Evento
      </button>

    </div>

    <div class="eventos-grid" id="listaEventos"></div>

    <p class="empty" id="mensagem">
      Nenhum evento cadastrado
    </p>

  </main>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

  <div class="modal-content">

    <h3>Novo Evento</h3>

    <input type="text" id="cliente" placeholder="ID do Cliente">

    <select id="tipo">
      <option value="">Tipo de Evento</option>
      <option>Casamento</option>
      <option>Aniversário</option>
      <option>Corporativo</option>
      <option>Formatura</option>
    </select>

    <input type="date" id="data">

    <input type="text" id="local" placeholder="Local">

    <input type="number" id="convidados" placeholder="Número de convidados">

    <div class="modal-botoes">

      <button class="btn" onclick="salvarEvento()">
        Salvar
      </button>

      <button class="btn cancelar" onclick="fecharModal()">
        Cancelar
      </button>

    </div>

  </div>

</div>

<script>
  

function toggleMenu(){

  const sidebar =
    document.querySelector(".sidebar");

  sidebar.classList.toggle("ativo");

}

lucide.createIcons()

lucide.createIcons()

// USUÁRIO
const usuario = JSON.parse(localStorage.getItem("usuario"))

if (!usuario || usuario.tipo !== "admin") {
  window.location.href = "../public/login.html"
}

// EVENTOS
let eventos = []

// MODAL
function abrirModal() {
  document.getElementById("modal").style.display = "flex"
}

function fecharModal() {
  document.getElementById("modal").style.display = "none"
}

// SALVAR EVENTO
async function salvarEvento() {

  const cliente_id = Number(document.getElementById("cliente").value)

  const tipo = document.getElementById("tipo").value

  const data = document.getElementById("data").value

  const local = document.getElementById("local").value.trim()

  const convidados =
    Number(document.getElementById("convidados").value) || 0

  if (!cliente_id || !tipo || !data || !local) {
    alert("Preencha todos os campos")
    return
  }

  try {

    const resEvento = await fetch("http://localhost:3000/eventos", {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        cliente_id,
        tipo,
        data,
        local,
        convidados,
        admin_id:usuario.id
      })

    })

    const dados = await resEvento.json()

    if (!resEvento.ok) {
      alert(dados.erro || "Erro ao criar evento")
      return
    }

    fecharModal()

    carregarEventos()

  } catch(err) {

    console.log(err)

    alert("Erro no servidor")
  }
}

// CARREGAR EVENTOS
async function carregarEventos() {

  try {

    const res = await fetch(
      `http://localhost:3000/eventos?admin_id=${usuario.id}`
    )

    eventos = await res.json()

    if (!Array.isArray(eventos)) {
      eventos = []
    }

    renderizarEventos()

  } catch(err) {

    console.log(err)
  }
}

// REMOVER EVENTO
async function removerEvento(id) {

  if (!confirm("Deseja remover este evento?")) return

  try {

    const res = await fetch(
      `http://localhost:3000/eventos/${id}`,
      {
        method:"DELETE"
      }
    )

    if (res.ok) {

      eventos = eventos.filter(e => e.id !== id)

      renderizarEventos()
    }

  } catch(err) {

    console.log(err)
  }
}

// VER PEDIDOS
function verPedidos(eventoId) {

  window.location.href =
    `pedidos.html?evento_id=${eventoId}`
}

// RENDER
function renderizarEventos() {

  const lista = document.getElementById("listaEventos")

  const mensagem = document.getElementById("mensagem")

  const quantidade =
    document.getElementById("quantidadeEventos")

  lista.innerHTML = ""

  quantidade.innerText =
    `${eventos.length} eventos agendados`

  if (eventos.length === 0) {

    mensagem.style.display = "block"

    return
  }

  mensagem.style.display = "none"

  eventos.forEach(e => {

    let status = (e.status || "Planejado").toLowerCase()

    let classe = "planejado"

    if (status.includes("confirm")) classe = "confirmado"
    if (status.includes("pend")) classe = "pendente"

    lista.innerHTML += `

      <div class="evento">

        <div class="evento-topo">

          <div class="evento-info">

            <div class="evento-icone">
              <i data-lucide="calendar-days"></i>
            </div>

            <div>
              <small>${e.tipo}</small>
              <strong>${e.data}</strong>
            </div>

          </div>

          <span class="status ${classe}">
            ${e.status || "Planejado"}
          </span>

        </div>

        <h3>${e.cliente || "Evento"}</h3>

        <p>
          <i data-lucide="users"></i>
          ${e.convidados || 0} convidados
        </p>

        <p>
          <i data-lucide="map-pin"></i>
          ${e.local}
        </p>

        <div class="acoes">

          <button
            class="btn-secundario"
            onclick="verPedidos(${e.id})">

            Ver Pedidos

          </button>

          <button
            class="btn-secundario btn-remover"
            onclick="removerEvento(${e.id})">

            Remover

          </button>

        </div>

      </div>

    `
  })

  lucide.createIcons()
}
async function carregarEventos() {

  try {

    const res = await fetch(
      `http://localhost:3000/eventos?admin_id=${usuario.id}`
    )

    eventos = await res.json()

    console.log("EVENTOS RECEBIDOS:", eventos)

    if (!Array.isArray(eventos)) {
      eventos = []
    }

    renderizarEventos()

  } catch(err) {

    console.log(err)
  }
}

// INIT
carregarEventos()

// AUTO UPDATE
setInterval(carregarEventos, 4000)

</script>

</body>
</html>
