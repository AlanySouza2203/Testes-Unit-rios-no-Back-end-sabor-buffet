<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sabor & Arte - Orçamentos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

:root{
    --bg:#020617;
    --sidebar:#0f172a;
    --card:#111827;

    --text:#e2e8f0;
    --muted:#94a3b8;

    --yellow:#facc15;
    --green:#22c55e;
    --blue:#3b82f6;
    --orange:#fb923c;
    --red:#ef4444;

    --border:rgba(255,255,255,0.06);
    --radius:20px;
}

body{
    background:var(--bg);
    color:var(--text);
    margin:0;
    overflow:hidden;
}

.container{
    display:flex;
    height:100vh;
    overflow:hidden;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    min-width:260px;
    height:100vh;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    padding:24px 18px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    overflow-y:auto;
}

.content{
    flex:1;
    height:100vh;
    padding:30px;
    overflow-y:auto;
}

.content::-webkit-scrollbar{
    width:8px;
}

.content::-webkit-scrollbar-track{
    background:#0f172a;
}

.content::-webkit-scrollbar-thumb{
    background:#facc15;
    border-radius:20px;
}

.sidebar-top{
    display:flex;
    flex-direction:column;
}

.logo{
    font-size:28px;
    font-weight:800;
    margin-bottom:40px;
    color:white;
}

.logo span{
    color:var(--yellow);
}

.menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:var(--muted);
    padding:14px 16px;
    border-radius:14px;
    transition:0.2s;
    font-size:15px;
    font-weight:500;
}

.menu a svg{
    width:19px;
    height:19px;
}

.menu a:hover{
    background:rgba(250,204,21,0.08);
    color:white;
}

.menu a.active{
    background:var(--yellow);
    color:black;
    font-weight:700;
}

.sidebar-footer{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,0.05);
}

.sidebar-footer a{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:var(--muted);
    padding:14px 16px;
    border-radius:14px;
    transition:0.2s;
    font-size:15px;
    font-weight:500;
}

.sidebar-footer a svg{
    width:18px;
    height:18px;
}

.sidebar-footer a:hover{
    background:rgba(255,255,255,0.05);
    color:white;
}

/* CONTENT */

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.titulo h1{
    font-size:36px;
    margin-bottom:6px;
}

.titulo p{
    color:var(--muted);
    font-size:15px;
}

.btn{
    border:none;
    background:var(--yellow);
    color:black;
    padding:14px 20px;
    border-radius:14px;
    cursor:pointer;
    font-weight:700;
    font-size:14px;
    transition:0.2s;
    display:flex;
    align-items:center;
    gap:8px;
}

.btn:hover{
    transform:scale(1.03);
}

/* CARDS TOPO */

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:24px;
}

.card small{
    color:var(--muted);
    display:block;
    margin-bottom:10px;
    font-size:13px;
}

.card h2{
    font-size:30px;
    font-weight:800;
    color:var(--yellow);
}

/* BUSCA */

.busca-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px 22px;
    margin-bottom:24px;
    display:flex;
    align-items:center;
    gap:12px;
}

.busca-box input{
    flex:1;
    background:transparent;
    border:none;
    color:white;
    font-size:14px;
    outline:none;
}

.busca-box input::placeholder{
    color:var(--muted);
}

/* LISTA */

.lista{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.orcamento{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    padding:22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:0.2s;
}

.orcamento:hover{
    transform:translateY(-3px);
    border-color:rgba(250,204,21,0.2);
}

.orc-esquerda{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.codigo{
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    letter-spacing:0.5px;
}

.orc-esquerda h3{
    font-size:18px;
    font-weight:700;
}

.orc-esquerda p{
    color:var(--muted);
    font-size:13px;
}

.badges{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:4px;
}

.status{
    padding:5px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}

.pendente{
    background:rgba(251,146,60,0.15);
    color:var(--orange);
}

.aprovado{
    background:rgba(34,197,94,0.15);
    color:var(--green);
}

.recusado{
    background:rgba(239,68,68,0.15);
    color:var(--red);
}

.orc-direita{
    text-align:right;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:10px;
}

.orc-direita small{
    color:var(--muted);
    font-size:12px;
}

.valor{
    font-size:24px;
    font-weight:800;
    color:var(--yellow);
}

.acoes{
    display:flex;
    gap:8px;
}

.btn-icon{
    width:36px;
    height:36px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.2s;
}

.btn-icon:hover{
    transform:scale(1.08);
}

.btn-editar{
    background:rgba(250,204,21,0.12);
    color:var(--yellow);
}

.btn-remover{
    background:rgba(239,68,68,0.12);
    color:var(--red);
}

.vazio{
    text-align:center;
    padding:60px;
    color:var(--muted);
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(4px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.modal-content{
    width:100%;
    max-width:480px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:28px;
    max-height:90vh;
    overflow-y:auto;
}

.modal-content::-webkit-scrollbar{
    width:6px;
}

.modal-content::-webkit-scrollbar-thumb{
    background:#facc15;
    border-radius:10px;
}

.modal-content h2{
    font-size:22px;
    margin-bottom:20px;
}

.campo{
    margin-bottom:14px;
}

.campo label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:600;
}

.campo select,
.campo input{
    width:100%;
    padding:13px 14px;
    background:#0f172a;
    border:1px solid var(--border);
    border-radius:12px;
    color:white;
    font-size:14px;
    outline:none;
    transition:0.2s;
}

.campo select:focus,
.campo input:focus{
    border-color:rgba(250,204,21,0.4);
}

.campo select option{
    background:#0f172a;
}

.row-campos{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:10px;
}

.btn-add-item{
    width:100%;
    background:rgba(250,204,21,0.1);
    border:1px dashed rgba(250,204,21,0.3);
    color:var(--yellow);
    padding:12px;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
    font-size:14px;
    transition:0.2s;
    margin-bottom:16px;
}

.btn-add-item:hover{
    background:rgba(250,204,21,0.18);
}

.lista-itens{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:16px;
    min-height:0;
}

.item-linha{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#0f172a;
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
}

.item-linha span{
    color:var(--yellow);
    font-weight:700;
}

.item-linha button{
    background:none;
    border:none;
    color:var(--red);
    cursor:pointer;
    font-size:16px;
    padding:2px 6px;
}

.total-box{
    background:#0f172a;
    border-radius:14px;
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.total-box span:first-child{
    color:var(--muted);
    font-size:14px;
}

.total-box span:last-child{
    font-size:20px;
    font-weight:800;
    color:var(--yellow);
}

.modal-botoes{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.btn-cancelar{
    background:#1e293b;
    color:white;
    border:none;
    padding:13px;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
    transition:0.2s;
}

.btn-cancelar:hover{
    background:#2d3e55;
}

/* MENU MOBILE */

.menu-mobile{
    position:fixed;
    top:20px;
    left:20px;
    width:55px;
    height:55px;
    border:none;
    border-radius:14px;
    background:#facc15;
    color:#000;
    font-size:28px;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:99999;
    cursor:pointer;
    box-shadow:0 4px 20px rgba(0,0,0,0.3);
}

@media(max-width:900px){

    body{ overflow-x:hidden; }

    .menu-mobile{
        display:flex;
    }

    .sidebar{
        position:fixed;
        top:0;
        left:-270px;
        width:260px;
        height:100vh;
        background:var(--sidebar);
        transition:0.3s;
        z-index:9998;
        overflow-y:auto;
    }

    .sidebar.ativo{
        left:0;
    }

    .content{
        width:100%;
        max-width:100%;
        padding:20px;
        padding-top:90px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .topo{
        flex-direction:column;
        align-items:flex-start;
        gap:16px;
    }

    .orcamento{
        flex-direction:column;
        align-items:flex-start;
        gap:14px;
    }

    .orc-direita{
        width:100%;
        flex-direction:row;
        justify-content:space-between;
        align-items:center;
    }

    .modal-content{
        width:92%;
        margin:0 auto;
    }
}

@media(min-width:901px){
    .menu-mobile{ display:none; }
}
</style>
</head>

<body>

<button class="menu-mobile" onclick="toggleMenu()">
    <i class="bi bi-list"></i>
</button>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="logo">
                Sabor<span>&Arte</span>
            </div>

            <nav class="menu">

                <a href="dashboard.html">

                </a>

                <a href="eventos.html">

                </a>

    <!-- CONTENT -->
    <main class="content">

        </div>

</div>

<!-- MODAL EDITAR STATUS DO ORÇAMENTO -->
<div class="modal" id="modal">

    <div class="modal-content">

        <h2 id="tituloModal">Editar Status do Orçamento</h2>

        <!-- INFORMAÇÕES  -->
        <div class="campo">
            <label>Cliente</label>
            <input type="text" id="infoCliente" readonly style="background:var(--sidebar);cursor:not-allowed;">
        </div>

        <div class="campo">
            <label>Tipo de Evento</label>
            <input type="text" id="infoEvento" readonly style="background:var(--sidebar);cursor:not-allowed;">
        </div>

        <div class="campo">
            <label>Data do Evento</label>
            <input type="text" id="infoData" readonly style="background:var(--sidebar);cursor:not-allowed;">
        </div>

        <!-- RESUMO DOS ITENS -->
        <div class="campo">
            <label>Itens</label>
            <div id="infoItens" style="background:var(--sidebar);padding:14px;border-radius:10px;color:var(--muted);max-height:150px;overflow-y:auto;"></div>
        </div>

        <!-- TOTAL -->
        <div class="total-box">
            <span>Valor Total</span>

        </div>

        <!-- STATUS -->
        <div class="campo">
            <label>Status</label>
            <select id="selectStatus">

                <option value="recusado">❌ Recusado</option>
            </select>
        </div>

        <!-- BOTÕES -->
        <div class="modal-botoes">
            <button class="btn" onclick="salvarStatusOrcamento()">
                Atualizar Status
            </button>
            <button class="btn-cancelar" onclick="fecharModal()">
                Cancelar
            </button>

    </div>

</div>

<script>

function toggleMenu(){
    document.getElementById("sidebar").classList.toggle("ativo");
}

lucide.createIcons();

/* =====================
   ESTADO
===================== */

const usuario = JSON.parse(localStorage.getItem("usuario"));

if (!usuario || usuario.tipo !== "admin") {
    window.location.href = "../public/login.html";
}

let orcamentos = [];
let eventos = [];
let itensCardapio = [];
let itensAdicionados = [];
let editandoId = null;

/* =====================
   CARREGAR DADOS
===================== */

async function carregarOrcamentos() {

    try {

        console.log("Carregando orçamentos...");

        const res = await fetch("http://localhost:3000/orcamentos");

        orcamentos = await res.json();

        console.log("Orçamentos carregados:", orcamentos);

        if (!Array.isArray(orcamentos)) orcamentos = [];

        renderOrcamentos();

    } catch (err) {

        console.log("Erro ao carregar orçamentos:", err);

        document.getElementById("listaOrcamentos").innerHTML = `
            <div class="vazio">
                <p>Erro ao carregar orçamentos. Verifique o servidor.</p>
            </div>
        `;
    }
}

async function carregarEventos() {

    try {

        console.log("Carregando eventos para admin_id:", usuario.id);

        const res = await fetch(
            `http://localhost:3000/eventos?admin_id=${usuario.id}`
        );

        eventos = await res.json();

        console.log("Eventos carregados:", eventos);

        if (!Array.isArray(eventos)) eventos = [];

        const sel = document.getElementById("selectEvento");
        sel.innerHTML = `<option value="">Selecione um evento...</option>`;

        if (eventos.length === 0) {
            console.warn("Nenhum evento carregado para admin_id:", usuario.id);
            sel.innerHTML += `<option value="" disabled>Nenhum evento disponível</option>`;
        }

        eventos.forEach(e => {
            console.log("Adicionando evento:", e.id, e.cliente, e.tipo);
            sel.innerHTML += `
                <option value="${e.id}">
                    #${e.id} — ${e.cliente || "Evento"} (${e.tipo || ""})
                </option>
            `;
        });

    } catch (err) {
        console.error("Erro ao carregar eventos:", err);
    }
}
async function carregarItens() {

    try {

        const res = await fetch("http://localhost:3000/itens");

        itensCardapio = await res.json();

        if (!Array.isArray(itensCardapio)) itensCardapio = [];

        const sel = document.getElementById("selectItem");
        sel.innerHTML = `<option value="">Selecione um item...</option>`;

        itensCardapio.forEach(i => {
            sel.innerHTML += `
                <option value="${i.id}" data-valor="${i.valor}" data-nome="${i.nome}">
                    ${i.nome} — ${formatarMoeda(i.valor)}
                </option>
            `;
        });

    } catch (err) {
        console.log("Erro ao carregar itens:", err);
    }
}

/* =====================
   RENDERIZAR LISTA
===================== */

function renderOrcamentos(lista) {

    const dados = lista !== undefined ? lista : orcamentos;

    console.log("=== RENDERIZANDO ===");
    console.log("Quantidade de orçamentos a renderizar:", dados.length);
    console.log("Dados:", dados);

    const container = document.getElementById("listaOrcamentos");
    container.innerHTML = "";

    document.getElementById("qtdOrcamentos").innerText =
        `${dados.length} orçamento${dados.length !== 1 ? "s" : ""} encontrado${dados.length !== 1 ? "s" : ""}`;

    if (!dados.length) {
        container.innerHTML = `
            <div class="vazio">
                <p>Nenhum orçamento encontrado</p>
            </div>
        `;
        atualizarCards(orcamentos);
        return;
    }

    dados.forEach(o => {
        console.log("Renderizando orçamento:", o.id, o.cliente);
        container.innerHTML += `
            <div class="orcamento">

                <div class="orc-esquerda">

                    <span class="codigo">#ORC-${String(o.id).padStart(4,"0")}</span>

                    <h3>${o.cliente || "Cliente não informado"}</h3>

                    <p>${o.tipo || "Evento não informado"} ${o.data ? "• " + formatarData(o.data) : ""}</p>

                    <div class="badges">
                        <span class="status ${o.status || "pendente"}">
                            ${iconeStatus(o.status)} ${capitalize(o.status || "pendente")}
                        </span>
                    </div>

                </div>

                <div class="orc-direita">

                    <small>Valor Total</small>

                    <div class="valor">
                        ${formatarMoeda(o.valor_total)}
                    </div>

                    <div class="acoes">

                        <button class="btn-icon btn-editar" onclick="editarOrcamento(${o.id})" title="Editar Status">
                            <i data-lucide="pencil" style="width:15px;height:15px;"></i>
                        </button>

                    </div>

                </div>

            </div>
        `;
    });

    atualizarCards(orcamentos);

    console.log("Renderização concluída!");

    lucide.createIcons();
}

function atualizarCards(lista) {

    let total = 0;
    let aguardando = 0;
    let aprovados = 0;

    lista.forEach(o => {
        total += Number(o.valor_total || 0);
        if (o.status === "pendente") aguardando++;
        if (o.status === "aprovado") aprovados++;
    });

    document.getElementById("valorTotal").innerText = formatarMoeda(total);
    document.getElementById("aguardando").innerText = aguardando;

    const taxa = lista.length
        ? Math.round((aprovados / lista.length) * 100)
        : 0;

    document.getElementById("taxa").innerText = `${taxa}%`;
}

/* =====================
   MODAL
===================== */

function fecharModal() {
    document.getElementById("modal").style.display = "none";
}

/* =====================
   ITENS NO MODAL (DESCONTINUADO)
===================== */

/* =====================
   SALVAR STATUS DO ORÇAMENTO
===================== */

async function salvarStatusOrcamento() {

    const status = document.getElementById("selectStatus").value;

    console.log("=== ATUALIZANDO STATUS ===");
    console.log("Orçamento ID:", editandoId);
    console.log("Novo status:", status);

    if (!editandoId) {
        alert("Erro: orçamento não identificado");
        return;
    }

    try {
        const res = await fetch(`http://localhost:3000/orcamentos/${editandoId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: status }) // Enviamos apenas o status
        });

        const resultado = await res.json();

        if (!res.ok) {
            alert(resultado.erro || "Erro ao atualizar status");
            return;
        }

        console.log("Status atualizado com sucesso!");
        fecharModal();
        await carregarOrcamentos();
        alert("Status atualizado!");

    } catch (err) {
        console.error("ERRO:", err);
        alert("Erro ao conectar com o servidor: " + err.message);
    }
}



/* =====================
   EDITAR STATUS ORÇAMENTO
===================== */

async function editarOrcamento(id) {
    console.log("=== EDITANDO ORÇAMENTO ID:", id);
    
    const o = orcamentos.find(item => item.id === id);
    if (!o) {
        console.error("Orçamento não encontrado na lista:", id);
        alert("Orçamento não encontrado");
        return;
    }

    console.log("Orçamento encontrado:", o);

    editandoId = id;
    
    // PREENCHER CAMPOS READ-ONLY
    document.getElementById("infoCliente").value = o.cliente || "Cliente não informado";
    document.getElementById("infoEvento").value = o.tipo || "Evento não informado";
    document.getElementById("infoData").value = o.data ? new Date(o.data).toLocaleDateString("pt-BR") : "Data não informada";
    document.getElementById("selectStatus").value = o.status || "pendente";
    document.getElementById("infoTotal").innerText = formatarMoeda(o.valor_total || 0);

    try {
        // Buscar itens do orçamento
        console.log("Buscando itens do orçamento...");
        const res = await fetch(`http://localhost:3000/orcamentos/${id}`);
        
        if (!res.ok) {
            throw new Error(`Erro HTTP: ${res.status}`);
        }
        
        const itens = await res.json();
        console.log("Itens recebidos:", itens);

        // Renderizar itens em modo read-only
        const containerItens = document.getElementById("infoItens");
        containerItens.innerHTML = "";

        if (!itens || itens.length === 0) {
            containerItens.innerHTML = `<p style="color:var(--muted);">Nenhum item neste orçamento</p>`;
        } else {
            itens.forEach((item, idx) => {
                const subtotal = item.valor * item.quantidade;
                containerItens.innerHTML += `
                    <div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <div>
                                <strong style="color:white;">${item.nome}</strong><br>
                                <small>${item.quantidade}x • ${formatarMoeda(item.valor)} cada</small>
                            </div>
                            <strong style="color:var(--yellow);">${formatarMoeda(subtotal)}</strong>
                        </div>
                    </div>
                `;
            });
        }
        
        // Abrir modal
        document.getElementById("modal").style.display = "flex";
        console.log("Modal aberto");

    } catch (err) {
        console.error("ERRO:", err);
        alert("Erro ao carregar itens do orçamento: " + err.message);
    }
}

/* =====================
   PESQUISA
===================== */

function pesquisar(termo) {

    if (!termo.trim()) {
        renderOrcamentos(orcamentos);
        return;
    }

    const t = termo.toLowerCase();

    const filtrados = orcamentos.filter(o =>
        (o.cliente || "").toLowerCase().includes(t) ||
        (o.tipo || "").toLowerCase().includes(t) ||
        (o.status || "").toLowerCase().includes(t)
    );

    renderOrcamentos(filtrados);
}

/* =====================
   UTILITÁRIOS
===================== */

function formatarMoeda(valor) {
    return Number(valor || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function formatarData(data) {
    if (!data) return "";
    return new Date(data).toLocaleDateString("pt-BR");
}

function iconeStatus(status) {
    if (status === "aprovado") return "";
    if (status === "pendente") return "";
    if (status === "recusado") return "";
    return "";
}

function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
}
