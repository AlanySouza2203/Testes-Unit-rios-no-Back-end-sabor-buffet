<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Dashboard Funcionários</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e2e8f0;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .logo span {
      color: #facc15;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }


    .container {
      display: flex;
      height: calc(100vh - 70px);
    }

    .sidebar {
      width: 240px;
      background: #111827;
      padding: 20px;
    }

    .menu a {
      display: block;
      padding: 12px;
      margin: 8px 0;
      color: #cbd5f5;
      border-radius: 8px;
      cursor: pointer;
    }

    .menu a.active,
    .menu a:hover {
      background: #facc15;
      color: #000;
    }


    .content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }


    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card-resumo {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
    }

    .card-resumo.destaque {
      background: #facc15;
      color: #000;
    }

    .card-resumo p {
      font-size: 26px;
      font-weight: bold;
    }


    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .box {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
    }


    .section {
      display: none;
    }

    .section.active {
      display: block;
    }


    .card {
      background: #1e293b;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>


  <div class="header">
    <div class="logo">Sabor<span>& Arte</span></div>
    <div class="header-right">

    </div>
  </div>


  <div class="container">


    <div class="sidebar">
      <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="clientes.html">Clientes</a>
        <a href="servicos.html">Serviços</a>
        <a href="eventos.html">Eventos</a>
        <a href="pedidos.html">Pedidos</a>
        <a href="orcamentos.html">Orçamentos</a>
      </div>
    </div>


    <div class="content">


      <div id="dashboard" class="section active">

        <div class="topo">
          <div>
            <h2>Dashboard</h2>
            <p>Bem-vindo</p>
          </div>
        </div>

        <div class="cards">
          <div class="card-resumo destaque">
            <h3>Total de Clientes</h3>
          </div>

          <div class="card-resumo">
            <h3>Eventos no Mês</h3>
          </div>

          <div class="card-resumo">
            <h3>Pedidos Pendentes</h3>
          </div>

          <div class="card-resumo">
            <h3>Receita Mensal</h3>
          </div>
        </div>

        <div class="grid">
          <div class="box">
            <h3>Receita dos Últimos Meses</h3>
          </div>

          <div class="box">
            <h3>Próximos Eventos</h3>
          </div>
        </div>

      </div>





    </div>
  </div>

  <script>





    let pedidos = []

    async function carregarPedidos() {
      let res = await fetch("http://localhost:3000/pedidos")
      pedidos = await res.json()
      ordenar()
    }

    function renderPedidos() {
      let container = document.getElementById('listaPedidos')
      container.innerHTML = ''

      pedidos.forEach(p => {
        let div = document.createElement('div')
        div.className = "card"

        div.innerHTML = `
<h3>Pedido #${p.id}</h3>
<p>${p.cliente}</p>
<p>Status: ${p.status}</p>
`

        container.appendChild(div)
      })
    }

    function ordenar() {
      pedidos.sort((a, b) => a.id - b.id)
      renderPedidos()
    }

    carregarPedidos()
    setInterval(carregarPedidos, 3000)

  </script>

</body>

</html>
