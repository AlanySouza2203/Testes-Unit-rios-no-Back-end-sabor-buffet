<!DOCTYPE html>
<html lang="pt-br">


<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Dashboard - Sabor & Arte</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://unpkg.com/lucide@latest"></script>



<style>


*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter', sans-serif;
}


:root{


  --bg:#020617;
  --sidebar:#0f172a;
  --card:#111827;


  --text:#e2e8f0;
  --muted:#94a3b8;


  --yellow:#facc15;
  --green:#22c55e;
  --orange:#fb923c;
  --blue:#3b82f6;
  --red:#ef4444;


  --border:rgba(255,255,255,0.06);


  --radius:18px;
}


body{
  background:var(--bg);
  color:var(--text);
}


.container{
  display:flex;
  min-height:100vh;
}


.sidebar{


  width:260px;
  background:var(--sidebar);
  border-right:1px solid var(--border);


  padding:24px 18px;
}


.logo{
  font-size:24px;
  font-weight:700;
  margin-bottom:40px;
}


.logo span{
  color:var(--yellow);
}


.menu{
  display:flex;
  flex-direction:column;
  gap:8px;
}


.menu a{


  display:flex;
  align-items:center;
  gap:12px;


  text-decoration:none;


  color:var(--muted);


  padding:14px 16px;


  border-radius:14px;


  transition:0.2s;
}


.menu a:hover{
  background:rgba(250,204,21,0.08);
  color:white;
}


.menu a.active{
  background:var(--yellow);
  color:black;
}


.content{
  flex:1;
  padding:32px;
}


.topo{


  display:flex;
  justify-content:space-between;
  align-items:center;


  margin-bottom:30px;
}


.topo h1{
  font-size:34px;
  margin-bottom:8px;
}


.topo p{
  color:var(--muted);
}


button{


  background:var(--yellow);


  border:none;


  padding:12px 18px;


  border-radius:12px;


  cursor:pointer;


  font-weight:600;


  transition:0.2s;
}


button:hover{
  transform:scale(1.03);
}


.cards{


  display:grid;
  grid-template-columns:repeat(4,1fr);


  gap:20px;


  margin-bottom:24px;
}


.card{


  background:var(--card);


  border:1px solid var(--border);


  border-radius:var(--radius);


  padding:24px;


  transition:0.2s;
}


.card:hover{
  transform:translateY(-3px);
}


.card-top{


  display:flex;
  justify-content:space-between;
  align-items:center;


  margin-bottom:18px;
}


.card small{
  color:var(--muted);
}


.card h2{
  font-size:32px;
  margin-top:10px;
}


.icon{


  width:46px;
  height:46px;


  display:flex;
  align-items:center;
  justify-content:center;


  border-radius:12px;
}


.yellow{
  background:rgba(250,204,21,0.12);
  color:var(--yellow);
}


.blue{
  background:rgba(59,130,246,0.12);
  color:var(--blue);
}


.orange{
  background:rgba(251,146,60,0.12);
  color:var(--orange);
}


.green{
  background:rgba(34,197,94,0.12);
  color:var(--green);
}


.grid{


  display:grid;
  grid-template-columns:2fr 1fr;


  gap:24px;
}


.box{


  background:var(--card);


  border:1px solid var(--border);


  border-radius:var(--radius);


  padding:24px;
}


.box h3{
  margin-bottom:20px;
}


.evento{


  display:flex;
  justify-content:space-between;
  align-items:center;


  padding:16px 0;


  border-bottom:1px solid var(--border);
}


.evento:last-child{
  border:none;
}


.evento strong{
  display:block;
  margin-bottom:5px;
}


.evento small{
  color:var(--muted);
}


.status{


  padding:6px 12px;


  border-radius:999px;


  font-size:12px;
  font-weight:600;
}

.aprovado, .confirmado, .entregue, .finalizado { background: rgba(34, 197, 94, 0.15); color: var(--green); }
.preparando, .preparo { background: rgba(59, 130, 246, 0.15); color: var(--blue); }
.pendente { background: rgba(251, 146, 60, 0.15); color: var(--orange); }
.cancelado, .recusado { background: rgba(239, 68, 68, 0.15); color: var(--red); }

table{
  width:100%;
  border-collapse:collapse;
}


th{


  text-align:left;


  color:var(--muted);


  font-weight:500;


  padding-bottom:16px;
}


td{


  padding:18px 0;


  border-top:1px solid var(--border);
}


@media(max-width:1100px){


  .cards{
    grid-template-columns:repeat(2,1fr);
  }


  .grid{
    grid-template-columns:1fr;
  }
}


@media(max-width:768px){


  .sidebar{
    display:none;
  }


  .cards{
    grid-template-columns:1fr;
  }


  .content{
    padding:20px;
  }
}
/* BOTÃO MOBILE */

.menu-mobile{

  position:fixed;
  top:20px;
  left:20px;

  width:50px;
  height:50px;

  border:none;
  border-radius:12px;

  background:var(--yellow);
  color:#000;

  font-size:28px;

  display:none;

  z-index:999;

  cursor:pointer;
}

.menu-mobile{

  position:fixed;
  top:20px;
  left:20px;

  width:55px;
  height:55px;

  border:none;
  border-radius:14px;

  background:#facc15;
  color:#000;

  font-size:30px;

  display:none;

  z-index:9999;

  cursor:pointer;
}

@media(max-width:768px){

  .menu-mobile{
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .sidebar{

    position:fixed;

    top:0;
    left:-270px;

    width:260px;
     display:flex;
  flex-direction:column;
    height:100vh;

    background:#0f172a;

    transition:0.3s;

    z-index:9998;
    overflow-y:auto;
  }

  .sidebar.ativo{
  left:0 !important;
}
}

/* FOOTER SIDEBAR (Estilo que faltava) */

.sidebar-footer{
  display:flex;
  flex-direction:column;
  gap:10px;

  padding-top:20px;

  border-top:1px solid rgba(255,255,255,0.05);
}

.sidebar-footer a{
  display:flex;
  align-items:center;
  gap:10px;

  text-decoration:none;

  color:var(--muted);

  padding:12px 14px;

  border-radius:12px;

  transition:0.2s;

  font-size:14px;
}

.sidebar-footer a svg{
  width:17px;
  height:17px;
}

.sidebar-footer a:hover{
  background:rgba(255,255,255,0.05);
  color:white;
}


</style>
</head>


<body>
  <button class="menu-mobile" onclick="toggleMenu()">
  <i class="bi bi-list"></i>
</button>


<div class="container">


  <aside class="sidebar" id="sidebar">

    <div class="sidebar-top">

      <div class="logo">
        Sabor<span>&Arte</span>
      </div>

      <nav class="menu">
        <a href="dashboard.html" class="active">
          <i data-lucide="layout-dashboard"></i>
          Dashboard
        </a>
        <a href="clientes.html">
          <i data-lucide="users"></i>
          Clientes
        </a>
        <a href="servicos.html">
          <i data-lucide="utensils-crossed"></i>
          Serviços
        </a>
        <a href="eventos.html">
          <i data-lucide="calendar"></i>
          Eventos
        </a>
        <a href="pedidos.html">
          <i data-lucide="shopping-bag"></i>
          Pedidos
        </a>
        <a href="orcamentos.html">
          <i data-lucide="file-text"></i>
          Orçamentos
        </a>
      </nav>

    </div>

    <!-- SIDEBAR FOOTER -->
    <div class="sidebar-footer">

      <a href="funcionarios.html" id="link-funcionarios" style="display: none;">
        <i data-lucide="user-cog"></i>
        Funcionários
      </a>

      <a href="../public/login.html">
        <i data-lucide="log-out"></i>
        Sair
      </a>

    </div>

  </aside>

  <main class="content">


    <div class="topo">


      <div>
        <h1>Dashboard</h1>
        <p>Bem-vindo de volta </p>
      </div>


      <button onclick="window.location.href='eventos.html'">
        Novo Evento
      </button>


    </div>


    <!-- CARDS -->
    <div class="cards">


      <div class="card">


        <div class="card-top">


          <div class="icon yellow">
            <i data-lucide="users"></i>
          </div>


        </div>


        <small>Total de Clientes</small>


        <h2 id="totalClientes">0</h2>


      </div>


      <div class="card">


        <div class="card-top">


          <div class="icon blue">
            <i data-lucide="calendar"></i>
          </div>


        </div>


        <small>Eventos no mês</small>


        <h2 id="totalEventos">0</h2>


      </div>


      <div class="card">


        <div class="card-top">


          <div class="icon orange">
            <i data-lucide="shopping-bag"></i>
          </div>


        </div>


        <small>Pedidos pendentes</small>


        <h2 id="totalPedidos">0</h2>


      </div>


      <div class="card">


        <div class="card-top">


          <div class="icon green">
            <i data-lucide="trending-up"></i>
          </div>


        </div>


        <small>Receita total</small>


        <h2 id="totalReceita">R$ 0</h2>


      </div>


    </div>


    <!-- GRID -->
    <div class="grid">


      

      <!-- EVENTOS -->
      <div class="box">


        <h3>Próximos Eventos</h3>


        <div id="listaEventos"></div>


      </div>


    </div>


    
    <!-- PEDIDOS -->
    <div class="box" style="margin-top:24px;">
      <h3>Pedidos Recentes</h3>
      <div id="listaPedidos"></div>
    </div>

  </main>



</div>


<script>

function toggleMenu(){

  const sidebar =
    document.getElementById("sidebar");

  sidebar.classList.toggle("ativo");

}


const usuario = JSON.parse(localStorage.getItem("usuario"))

if (usuario && usuario.email === 'admin@email.com') {
    document.getElementById('link-funcionarios').style.display = 'flex';
}




lucide.createIcons()


// PROTEÇÃO
if (!usuario || (usuario.tipo !== "admin" && usuario.tipo !== "funcionario") || !usuario.id) {
  window.location.href = "../public/login.html"
}


let pedidos = []
let clientes = []
let eventos = []


/* =========================
   PEDIDOS
========================= */
async function carregarPedidos() {


  try {


    let res = await fetch(`http://localhost:3000/pedidos`)


    pedidos = await res.json()


    if (!Array.isArray(pedidos)) pedidos = []


    ordenar()
    atualizarDashboard()


  } catch (err) {


    console.log("Erro pedidos:", err)
  }
}


/* =========================
   CLIENTES
========================= */
async function carregarClientes() {


  try {


    let res = await fetch(`http://localhost:3000/clientes`)


    clientes = await res.json()


    if (!Array.isArray(clientes)) clientes = []


    atualizarDashboard()


  } catch (err) {


    console.log("Erro clientes:", err)
  }
}


/* =========================
   EVENTOS
========================= */
async function carregarEventos() {


  try {


    let res = await fetch(`http://localhost:3000/eventos`)


    eventos = await res.json()


    if (!Array.isArray(eventos)) eventos = []


    renderEventos()
    atualizarDashboard()


  } catch (err) {


    console.log("Erro eventos:", err)
  }
}


/* =========================
   RENDER PEDIDOS
========================= */
function renderPedidos() {
  let container = document.getElementById('listaPedidos')
  container.innerHTML = ''
  pedidos.slice(0, 5).forEach(p => {
    const statusClass = (p.status || "pendente").toLowerCase();
    const idFormatado = `#ORC-${String(p.id).padStart(4, '0')}`;
    const dataEvento = p.evento_data ? new Date(p.evento_data).toLocaleDateString('pt-BR') : 'Data a definir';

    container.innerHTML += `
      <div style="padding: 16px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px;">
        <div style="color: var(--yellow); font-weight: bold; font-size: 13px;">${idFormatado}</div>
        
        <div style="font-size: 19px; font-weight: 700; color: #fff; margin-top: 2px;">
            ${p.cliente || "Cliente"}
        </div>
        
        <div style="color: var(--muted); font-size: 14px; margin-bottom: 8px;">
          ${p.evento_tipo || "Evento"} • ${dataEvento}
        </div>

        <div>
          <span class="status ${statusClass}">${p.status || "Pendente"}</span>
        </div>
      </div>
    `;
  });
}



/* =========================
   EVENTOS
========================= */
function renderEventos() {


  let container = document.getElementById("listaEventos")


  container.innerHTML = ""


  eventos.slice(0, 4).forEach(e => {


    container.innerHTML += `


      <div class="evento">


        <div>
          <strong>${e.tipo || "Evento"}</strong>
          <small>${e.convidados || 0} convidados</small>
        </div>


        <span class="status confirmado">
          ${e.status || "Confirmado"}
        </span>


      </div>


    `
  })
}


/* =========================
   ORDENAR
========================= */
function ordenar() {


  pedidos.sort((a, b) => b.id - a.id)


  renderPedidos()
}


/* =========================
   RECEITA
========================= */
function calcularReceita() {


  return pedidos.reduce((total, p) => {


    return total + (Number(p.total) || 0)


  }, 0)
}


/* =========================
   DASHBOARD
========================= */
function atualizarDashboard() {

  let receita = calcularReceita()
  let totalClientes = clientes.length
  let totalEventos = eventos.length

  let pedidosPendentes = pedidos.filter(p => {
    return (p.status || "").toLowerCase() === "pendente"
  }).length

  // FORMATA RECEITA CORRETAMENTE
  document.getElementById("totalReceita").innerText =
    receita.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    })

  document.getElementById("totalClientes").innerText =
    totalClientes

  document.getElementById("totalEventos").innerText =
    totalEventos

  document.getElementById("totalPedidos").innerText =
    pedidosPendentes
}


/* =========================
   INIT
========================= */
async function carregarTudo() {


  await Promise.all([
    carregarPedidos(),
    carregarClientes(),
    carregarEventos()
  ])
}


carregarTudo()


/* =========================
   AUTO UPDATE
========================= */
setInterval(carregarPedidos, 3000)


setInterval(() => {


  carregarClientes()
  carregarEventos()


}, 6000)




</script>


</body>
</html>
