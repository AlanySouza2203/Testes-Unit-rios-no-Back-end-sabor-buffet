<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sabor & Arte - Clientes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

:root{

  --bg:#020617;
  --sidebar:#0f172a;
  --card:#111827;

  --text:#e2e8f0;
  --muted:#94a3b8;

  --yellow:#facc15;
  --green:#22c55e;
  --red:#ef4444;

  --border:rgba(255,255,255,0.06);

  --radius:18px;
}

body{
  background:var(--bg);
  color:var(--text);
}

.container{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:260px;
  background:var(--sidebar);

  border-right:1px solid var(--border);

  padding:24px 18px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.sidebar-top{
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:28px;
  font-weight:700;
  margin-bottom:40px;
}

.logo span{
  color:var(--yellow);
}

.menu{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.menu a{
  display:flex;
  align-items:center;
  gap:12px;

  text-decoration:none;

  color:var(--muted);

  padding:14px 16px;

  border-radius:14px;

  transition:0.2s;

  font-size:15px;
  font-weight:500;
}

.menu a svg{
  width:18px;
  height:18px;
}

.menu a:hover{
  background:rgba(250,204,21,0.08);
  color:white;
}

.menu a.active{
  background:var(--yellow);
  color:black;
  font-weight:700;
}

/* FOOTER SIDEBAR */

.sidebar-footer{
  display:flex;
  flex-direction:column;
  gap:10px;

  padding-top:20px;

  border-top:1px solid rgba(255,255,255,0.05);
}

.sidebar-footer a{
  display:flex;
  align-items:center;
  gap:10px;

  text-decoration:none;

  color:var(--muted);

  padding:12px 14px;

  border-radius:12px;

  transition:0.2s;

  font-size:14px;
}

.sidebar-footer a svg{
  width:17px;
  height:17px;
}

.sidebar-footer a:hover{
  background:rgba(255,255,255,0.05);
  color:white;
}

/* CONTENT */

.content{
  flex:1;
  padding:28px;
  overflow-y:auto;
}

.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:24px;
}

.titulo h1{
  font-size:38px;
  margin-bottom:5px;
}

.titulo p{
  color:var(--muted);
}

.btn{
  background:var(--yellow);

  border:none;

  padding:14px 18px;

  border-radius:12px;

  cursor:pointer;

  font-weight:600;

  display:flex;
  align-items:center;
  gap:8px;

  transition:0.2s;
}

.btn:hover{
  transform:scale(1.03);
}

/* BOX */

.box{
  background:var(--card);

  border:1px solid var(--border);

  border-radius:24px;

  padding:22px;
}

.busca{
  position:relative;
  margin-bottom:24px;
}

.busca i{
  position:absolute;

  left:16px;
  top:15px;

  color:var(--muted);
}

.busca input{
  width:100%;

  background:#0b1120;

  border:1px solid var(--border);

  color:white;

  padding:14px 16px 14px 45px;

  border-radius:14px;

  outline:none;
}

/* CLIENTES */

.lista-clientes{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.cliente{
  background:#0b1120;

  border:1px solid rgba(255,255,255,0.04);

  border-radius:18px;

  padding:18px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  transition:0.2s;
}

.cliente:hover{
  transform:translateY(-2px);
}

.cliente-esquerda{
  display:flex;
  align-items:center;
  gap:14px;
}

.avatar{
  width:42px;
  height:42px;

  border-radius:50%;

  background:rgba(250,204,21,0.12);

  color:var(--yellow);

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:700;
}

.info h3{
  margin-bottom:5px;
}

.info small{
  color:var(--muted);

  display:flex;
  align-items:center;
  gap:12px;
}

.info small span{
  display:flex;
  align-items:center;
  gap:4px;
}

.cliente-direita{
  display:flex;
  align-items:center;
  gap:28px;
}

.metricas{
  text-align:center;
}

.metricas small{
  color:var(--muted);
}

.metricas strong{
  display:block;
  margin-top:4px;
  color:var(--yellow);
}

.status{
  background:rgba(34,197,94,0.15);

  color:var(--green);

  padding:8px 14px;

  border-radius:999px;

  font-size:13px;
  font-weight:600;
}

.acoes{
  display:flex;
  gap:8px;
}

.acoes button{
  width:38px;
  height:38px;

  border:none;

  border-radius:10px;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:0.2s;
}

.btn-editar{
  background:rgba(250,204,21,0.12);
  color:var(--yellow);
}

.btn-remover{
  background:rgba(239,68,68,0.12);
  color:var(--red);
}

.acoes button:hover{
  transform:scale(1.05);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,0.7);

  display:none;
  justify-content:center;
  align-items:center;

  z-index:999;
}

.modal-content{
  width:100%;
  max-width:400px;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:24px;

  padding:24px;
}

.modal-content h3{
  margin-bottom:20px;
  font-size:24px;
}

.modal-content input{
  width:100%;

  background:#0b1120;

  border:1px solid var(--border);

  color:white;

  padding:14px;

  border-radius:12px;

  outline:none;

  margin-bottom:14px;
}

.modal-botoes{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.cancelar{
  background:#1e293b;
  color:white;
}

/* =========================
   MENU MOBILE
========================= */

.menu-mobile{

  position:fixed;
  top:20px;
  left:20px;

  width:55px;
  height:55px;

  border:none;
  border-radius:14px;

  background:var(--yellow);
  color:#000;

  font-size:30px;

  display:none;

  z-index:9999;

  cursor:pointer;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:900px){

  .menu-mobile{
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .sidebar{

    position:fixed;

    top:0;
    left:-270px;

    width:260px;
    height:100vh;

    background:var(--sidebar);

    transition:0.3s;

    z-index:9998;

    overflow-y:auto;
  }

  .sidebar.ativo{
    left:0 !important;
  }

  .content{
    width:100%;
    padding:20px;
    padding-top:90px;
  }

  .topo{
    flex-direction:column;
    align-items:flex-start;
    gap:18px;
  }

  .titulo h1{
    font-size:32px;
  }

  .cliente{
    flex-direction:column;
    align-items:flex-start;
    gap:20px;
  }

  .cliente-direita{
    width:100%;
    justify-content:space-between;
  }

  .info small{
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
  }

  .modal-content{
    width:90%;
  }
}

</style>

</head>

<body>
  <button class="menu-mobile" onclick="toggleMenu()">
  <i class="bi bi-list"></i>
</button>

<div class="container">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-top">

      <div class="logo">
        Sabor<span>&Arte</span>
      </div>

      <nav class="menu">

        <a href="dashboard.html">
          <i data-lucide="layout-dashboard"></i>
          Dashboard
        </a>

        <a href="clientes.html" class="active">
          <i data-lucide="users"></i>
          Clientes
        </a>

        <a href="servicos.html">
          <i data-lucide="utensils-crossed"></i>
          Serviços
        </a>

        <a href="eventos.html">
          <i data-lucide="calendar"></i>
          Eventos
        </a>

        <a href="pedidos.html">
          <i data-lucide="shopping-bag"></i>
          Pedidos
        </a>

        <a href="orcamentos.html">
          <i data-lucide="file-text"></i>
          Orçamentos
        </a>

      </nav>

    </div>

    <div class="sidebar-footer">

      <a href="#">
        <i data-lucide="panel-left-close"></i>
        Recolher
      </a>

      <a href="../public/login.html">
        <i data-lucide="log-out"></i>
        Sair
      </a>

    </div>

  </aside>

  <!-- CONTENT -->
  <main class="content">

    <div class="topo">

      <div class="titulo">
        <h1>Clientes</h1>
        <p id="totalClientes">0 clientes cadastrados</p>
      </div>

      <button class="btn" onclick="abrirModal()">
        <i data-lucide="plus"></i>
        Novo Cliente
      </button>

    </div>

    <div class="box">

      <div class="busca">

        <i data-lucide="search"></i>

        <input
          type="text"
          placeholder="Buscar clientes..."
          oninput="buscar(this.value)"
        >

      </div>

      <div class="lista-clientes" id="listaClientes"></div>

    </div>

  </main>

</div>

<!-- MODAL -->

<div class="modal">

  <div class="modal-content">

    <h3>Novo Cliente</h3>

    <input type="text" id="nome" placeholder="Nome">

    <input type="text" id="telefone" placeholder="Telefone">

    <input type="email" id="email" placeholder="Email">

    <div class="modal-botoes">

      <button class="btn" onclick="salvar()">
        Salvar
      </button>

      <button class="btn cancelar" onclick="fecharModal()">
        Cancelar
      </button>

    </div>

  </div>

</div>

<script>
  function toggleMenu(){

  const sidebar =
    document.getElementById("sidebar");

  sidebar.classList.toggle("ativo");

}

lucide.createIcons()

const usuario = JSON.parse(localStorage.getItem("usuario"))

if(!usuario || usuario.tipo !== "admin"){
  window.location.href = "../public/login.html"
}

let clientes = []

let editando = null

const modal = document.querySelector(".modal")

// CARREGAR CLIENTES
async function carregarClientes(){

  try{

    const res = await fetch(
      `http://localhost:3000/clientes?admin_id=${usuario.id}`
    )

    clientes = await res.json()

    if(!Array.isArray(clientes)){
      clientes = []
    }

    render(clientes)

  }catch(err){

    console.log(err)
  }
}

// RENDER
function render(lista = clientes){

  const container = document.getElementById("listaClientes")
  const total = document.getElementById("totalClientes")

  container.innerHTML = ""

  total.innerText = `${lista.length} clientes cadastrados`

  lista.forEach(c => {

    let inicial =
      c.nome ? c.nome.charAt(0).toUpperCase() : "C"

    container.innerHTML += `

      <div class="cliente">

        <div class="cliente-esquerda">

          <div class="avatar">
            ${inicial}
          </div>

          <div class="info">

            <h3>${c.nome}</h3>

            <small>

              <span>
                <i data-lucide="mail"></i>
                ${c.email}
              </span>

              <span>
                <i data-lucide="phone"></i>
                ${c.telefone}
              </span>

            </small>

          </div>

        </div>

        <div class="cliente-direita">

          <span class="status">
            Ativo
          </span>

          <div class="acoes">

            <button
              class="btn-editar"
              onclick="editar(${c.id})"
            >
              <i data-lucide="pencil"></i>
            </button>

            <button
              class="btn-remover"
              onclick="remover(${c.id})"
            >
              <i data-lucide="trash-2"></i>
            </button>

          </div>

        </div>

      </div>

    `
  })

  lucide.createIcons()
}

// MODAL
function abrirModal(){

  document.querySelector(
    ".modal-content h3"
  ).innerText = "Novo Cliente"

  modal.style.display = "flex"
}

function fecharModal(){

  modal.style.display = "none"

  limpar()
}

function limpar(){

  nome.value = ""
  telefone.value = ""
  email.value = ""

  editando = null
}

// SALVAR
async function salvar(){

  let resposta

  try{

    if(editando !== null){

      // EDITAR CLIENTE
      const clienteAtualizado = {
        nome: nome.value.trim(),
        telefone: telefone.value.trim(),
        email: email.value.trim()
      }

      if(!clienteAtualizado.nome || !clienteAtualizado.telefone || !clienteAtualizado.email){
        return alert("Preencha todos os campos")
      }

      resposta = await fetch(
        `http://localhost:3000/clientes/${editando}`,
        {
          method:"PUT",
          headers:{
            "Content-Type":"application/json"
          },
          body: JSON.stringify(clienteAtualizado)
        }
      )

    }else{

      // NOVO CLIENTE
      const novoCliente = {
        nome: nome.value.trim(),
        telefone: telefone.value.trim(),
        email: email.value.trim(),
        admin_id: usuario.id
      }

      if(!novoCliente.nome || !novoCliente.telefone || !novoCliente.email){
        return alert("Preencha todos os campos")
      }

      resposta = await fetch(
        "http://localhost:3000/clientes",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body: JSON.stringify(novoCliente)
        }
      )
    }

    if(!resposta.ok){

      const erroTexto = await resposta.text()
      console.log("ERRO BACKEND:", erroTexto)

      return alert("Erro ao salvar")
    }

    fecharModal()
    await carregarClientes()

   const eraEdicao = editando !== null

fecharModal()
await carregarClientes()

alert(
  eraEdicao
    ? "Cliente atualizado!"
    : "Cliente criado!"
)

  }catch(err){

    console.log("ERRO REAL:", err)
    alert("Erro no servidor")
  }
}
// EDITAR
async function editar(id){

  const c = clientes.find(cliente => cliente.id == id)

  if(!c){
    alert("Cliente não encontrado")
    return
  }

  editando = id

  nome.value = c.nome || ""
  telefone.value = c.telefone || ""
  email.value = c.email || ""

  document.querySelector(
    ".modal-content h3"
  ).innerText = "Editar Cliente"

  modal.style.display = "flex"
}

// REMOVER
async function remover(id){

  if(!confirm(
    "Excluir cliente, pedidos e eventos?"
  )) return

  try{

    // APAGA EVENTOS DO CLIENTE
    const eventos =
      await fetch(
        `http://localhost:3000/eventos?cliente_id=${id}`
      )

    const listaEventos =
      await eventos.json()

    for(const evento of listaEventos){

      await fetch(
        `http://localhost:3000/eventos/${evento.id}`,
        {
          method:"DELETE"
        }
      )
    }


    // APAGA PEDIDOS DO CLIENTE
    const pedidos =
      await fetch(
        `http://localhost:3000/pedidos?cliente_id=${id}`
      )

    const listaPedidos =
      await pedidos.json()

    for(const pedido of listaPedidos){

      await fetch(
        `http://localhost:3000/pedidos/${pedido.id}`,
        {
          method:"DELETE"
        }
      )
    }


    // APAGA CLIENTE
    await fetch(
      `http://localhost:3000/clientes/${id}`,
      {
        method:"DELETE"
      }
    )

    carregarClientes()

    alert("Cliente removido")

  }catch(err){

    console.log(err)

    alert("Erro ao excluir")
  }
}
// INIT
carregarClientes()

</script>

</body>
</html>
