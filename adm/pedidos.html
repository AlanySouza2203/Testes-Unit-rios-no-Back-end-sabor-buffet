<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sabor & Arte - Pedidos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"

href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

:root{

    --bg:#020617;
    --sidebar:#0f172a;
    --card:#111827;

    --text:#e2e8f0;
    --muted:#94a3b8;

    --yellow:#facc15;
    --green:#22c55e;
    --blue:#3b82f6;
    --orange:#fb923c;
    --red:#ef4444;

    --border:rgba(255,255,255,0.06);

    --radius:20px;
}

body{
    background:var(--bg);
    color:var(--text);
    margin:0;
    overflow:hidden;
}

/* layout */
.container{
    display:flex;
    height:100vh;
    overflow:hidden;
}

/* sidebar fixa */
.sidebar{
    width:260px;
    min-width:260px;
    height:100vh;

    background:var(--sidebar);
    border-right:1px solid var(--border);

    padding:24px 18px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    overflow-y:auto;
}

/* conteúdo com rolagem */
.content{
    flex:1;
    height:100vh;

    padding:30px;

    overflow-y:auto;
}

/* BARRA DE ROLAGEM ESTILO SABOR&ARTE */
.content::-webkit-scrollbar,
.sidebar::-webkit-scrollbar{
    width:10px;
}

.content::-webkit-scrollbar-track,
.sidebar::-webkit-scrollbar-track{
    background:#0f172a;
}

.content::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb{
    background:#facc15;
    border-radius:20px;
}

.content::-webkit-scrollbar-thumb:hover,
.sidebar::-webkit-scrollbar-thumb:hover{
    background:#eab308;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:var(--sidebar);

    border-right:1px solid var(--border);

    padding:24px 18px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.sidebar-top{
    display:flex;
    flex-direction:column;
}

.logo{
    font-size:28px;
    font-weight:800;
    margin-bottom:40px;
    color:white;
}

.logo span{
    color:var(--yellow);
}

.menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;

    text-decoration:none;

    color:var(--muted);

    padding:14px 16px;

    border-radius:14px;

    transition:0.2s;

    font-size:15px;
    font-weight:500;
}

.menu a svg{
    width:19px;
    height:19px;
}

.menu a:hover{
    background:rgba(250,204,21,0.08);
    color:white;
}

.menu a.active{
    background:var(--yellow);
    color:black;
    font-weight:700;
}

.sidebar-footer{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding-top:20px;
}

.sidebar-footer a{
    display:flex;
    align-items:center;
    gap:12px;

    text-decoration:none;

    color:var(--muted);

    padding:14px 16px;

    border-radius:14px;

    transition:0.2s;

    font-size:15px;
    font-weight:500;
}

.sidebar-footer a svg{
    width:18px;
    height:18px;
}

.sidebar-footer a:hover{
    background:rgba(255,255,255,0.05);
    color:white;
}

/* CONTENT */

.content{
    flex:1;
    padding:30px;
    overflow-y:auto;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:30px;
}

.titulo h1{
    font-size:36px;
    margin-bottom:6px;
}

.titulo p{
    color:var(--muted);
    font-size:15px;
}

/* PEDIDOS */

.lista-pedidos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
    gap:22px;
      width:100%;
}

.pedido{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:24px;

    padding:22px;

    transition:0.2s;
}

.pedido:hover{
    transform:translateY(-4px);
}

.pedido-topo{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    margin-bottom:18px;
}

.pedido-info{
    display:flex;
    gap:14px;
}

.pedido-icone{
    width:50px;
    height:50px;

    border-radius:14px;

    background:rgba(250,204,21,0.12);

    color:var(--yellow);

    display:flex;
    align-items:center;
    justify-content:center;
}

.pedido small{
    color:var(--muted);
}

.pedido strong{
    font-size:16px;
}

.pedido h3{
    font-size:22px;
    margin:18px 0;
    line-height:1.4;
}

.pedido p{
    display:flex;
    align-items:center;
    gap:8px;

    color:var(--muted);

    margin-bottom:10px;
}

.status{
    padding:6px 12px;

    border-radius:999px;

    font-size:12px;
    font-weight:700;
}

.pendente{
    background:rgba(251,146,60,0.15);
    color:var(--orange);
}

.preparando{
    background:rgba(59,130,246,0.15);
    color:var(--blue);
}

.entregue{
    background:rgba(34,197,94,0.15);
    color:var(--green);
}

.acoes{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;

    margin-top:20px;
}

.acoes button{
    border:none;

    padding:12px;

    border-radius:12px;

    cursor:pointer;

    font-weight:700;

    transition:0.2s;
}

.acoes button:hover{
    transform:scale(1.02);
}

.btn-preparar{
    background:#2563eb;
    color:white;
}

.btn-entregar{
    background:#16a34a;
    color:white;
}

.btn-editar{
    background:var(--yellow);
    color:black;
}

.btn-remover{
    background:rgba(239,68,68,0.15);
    color:var(--red);
}

.vazio{
    color:var(--muted);
    text-align:center;
    margin-top:60px;
    font-size:16px;
}

/* RESPONSIVO */

@media(max-width:900px){

    body{
        overflow-x:hidden;
    }

    .container{
        width:100%;
        overflow-x:hidden;
    }

    .menu-mobile{
        display:flex;
    }

    .sidebar{

        position:fixed;

        top:0;
        left:-270px;

        width:260px;
        height:100vh;

        background:var(--sidebar);

        transition:0.3s;

        z-index:9998;

        overflow-y:auto;
    }

    .sidebar.ativo{
        left:0 !important;
    }

    .content{
        width:100%;
        max-width:100%;
        padding:20px;
        padding-top:90px;

        overflow-x:hidden;
    }

    .topo{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .titulo h1{
        font-size:32px;
    }

    .lista-pedidos{
        grid-template-columns:1fr;
        width:100%;
    }

    .pedido{
        width:100%;
        max-width:100%;
        padding:18px;
    }

    .pedido-topo{
        flex-direction:column;
        gap:15px;
        align-items:flex-start;
    }

    .pedido-info{
        width:100%;
    }

    .pedido h3{
        font-size:18px;
        line-height:1.5;

        word-break:break-word;
    }

    .acoes{
        grid-template-columns:1fr;
    }

    .acoes button{
        width:100%;
    }
}
/* MENU MOBILE */

.menu-mobile{

    position:fixed;
    top:20px;
    left:20px;

    width:55px;
    height:55px;

    border:none;
    border-radius:14px;

    background:#facc15;
    color:#000;

    font-size:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:99999;

    cursor:pointer;

    box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
@media(min-width:901px){

    .menu-mobile{
        display:none;
    }

}
</style>
</head>

<body>
   <button class="menu-mobile" onclick="toggleMenu()">
  <i class="bi bi-list"></i>
</button>

<div class="container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-top">

            <div class="logo">
                Sabor<span>&Arte</span>
            </div>

            <nav class="menu">

                <a href="dashboard.html">
                    <i data-lucide="layout-dashboard"></i>
                    Dashboard
                </a>

                <a href="clientes.html">
                    <i data-lucide="users"></i>
                    Clientes
                </a>

                <a href="servicos.html">
                    <i data-lucide="utensils-crossed"></i>
                    Serviços
                </a>

                <a href="eventos.html">
                    <i data-lucide="calendar"></i>
                    Eventos
                </a>

                <a href="pedidos.html" class="active">
                    <i data-lucide="shopping-bag"></i>
                    Pedidos
                </a>

                <a href="orcamentos.html">
                    <i data-lucide="file-text"></i>
                    Orçamentos
                </a>

            </nav>

        </div>

        <div class="sidebar-footer">

            <a href="funcionarios.html" id="link-funcionarios" style="display: none;">
                <i data-lucide="user-cog"></i>
                Funcionários
            </a>

            <a href="../public/login.html">
                <i data-lucide="log-out"></i>
                Sair
            </a>

        </div>

    </aside>

    <!-- CONTENT -->

    <main class="content">

        <div class="topo">

            <div class="titulo">
                <h1>Pedidos</h1>
                <p id="quantidadePedidos">0 pedidos encontrados</p>
            </div>

        </div>

        <div class="lista-pedidos" id="listaPedidos"></div>

    </main>

</div>

<script>
   

function toggleMenu(){

    const sidebar =
        document.querySelector(".sidebar")

    sidebar.classList.toggle("ativo")
}

lucide.createIcons()

const usuario = JSON.parse(localStorage.getItem("usuario"));

if (usuario && usuario.email === 'admin@email.com') {
    document.getElementById('link-funcionarios').style.display = 'flex';
}

let pedidos = []

// EVENTO URL
const params = new URLSearchParams(window.location.search)

const eventoId = params.get("evento_id")

if (!usuario || (usuario.tipo !== "admin" && usuario.tipo !== "funcionario")) {
    window.location.href = "../public/login.html";
}

// CARREGAR PEDIDOS
async function carregarPedidos() {

    try {

        if (!usuario || !usuario.id) return

        let url =
            `http://localhost:3000/pedidos?admin_id=${usuario.id}`
        // O filtro por admin_id não é mais necessário no backend
        url = `http://localhost:3000/pedidos`

        const res = await fetch(url)

        pedidos = await res.json()

        if (!Array.isArray(pedidos)) {
            pedidos = []
        }

        renderPedidos()

    } catch(err) {

        console.log(err)
    }
}

// RENDER
function renderPedidos() {

    const container =
        document.getElementById("listaPedidos")

    const quantidade =
        document.getElementById("quantidadePedidos")

    container.innerHTML = ""

    quantidade.innerText =
        `${pedidos.length} pedidos encontrados`

    if (!pedidos.length) {

        container.innerHTML = `
            <p class="vazio">
                Nenhum pedido encontrado
            </p>
        `

        return
    }

    pedidos.forEach(p => {

        let itens = []

        try {

            itens =
                typeof p.itens === "string"
                ? JSON.parse(p.itens)
                : p.itens

        } catch {

            itens = []
        }

        let itensTexto = Array.isArray(itens)
            ? itens.map(i =>
                `${i.nome} (${i.qtd}x)`
              ).join(", ")
            : "Sem itens"

        let status =
            (p.status || "pendente").toLowerCase()

        let statusTexto = "Pendente"

        if (status === "preparando") {
            statusTexto = "Preparando"
        }

        if (status === "finalizado") {
            statusTexto = "Finalizado"
        }

        container.innerHTML += `

        <div class="pedido">

            <div class="pedido-topo">

                <div class="pedido-info">

                    <div class="pedido-icone">
                        <i data-lucide="shopping-bag"></i>
                    </div>

                    <div>
                        <small>Pedido #${p.id}</small>
                        <br>
                        <strong>${p.cliente || "Cliente"}</strong>
                    </div>

                </div>

                <span class="status ${status}">
                    ${statusTexto}
                </span>

            </div>

            <h3>${itensTexto}</h3>

            <p>
                <i data-lucide="calendar-days"></i>
                Evento #${p.evento_id || "-"}
            </p>

            <p>
    <i data-lucide="wallet"></i>
    Total: ${formatarMoeda(p.total)}
</p>

            <div class="acoes">

                <button
                    class="btn-preparar"
                    onclick="preparar(${p.id}, ${p.cliente_id})">

                    Preparar

                </button>

                <button
                    class="btn-entregar"
                    onclick="finalizar(${p.id}, ${p.cliente_id})">

                    Finalizar

                </button>

                <button
                    class="btn-remover"
                    onclick="remover(${p.id})">

                    Remover

                </button>

            </div>

        </div>

        `
    })

    lucide.createIcons()
}
function formatarMoeda(valor) {
    // Garante que o valor é um número antes de formatar
    const numero = Number(valor);
    if (isNaN(numero)) {
        return "R$ 0,00";
    }
    return Number(valor || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

// PREPARAR
async function preparar(pedidoId, clienteId) {
    if (!confirm("Deseja marcar este pedido como 'Preparando' e notificar o cliente?")) return;

    try {
        // 1. Atualizar o status do pedido
        await fetch(`http://localhost:3000/pedidos/${pedidoId}/status`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: "Preparando" })
        });

        // 2. Enviar mensagem para o cliente
        await fetch(`http://localhost:3000/mensagens`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                pedido_id: pedidoId,
                cliente_id: clienteId,
                mensagem: "Seu pedido começou a ser preparado! 🎉",
                tipo: "admin"
            })
        });

        alert("Status alterado e cliente notificado!");
        carregarPedidos();

    } catch (err) {
        console.error("Erro ao preparar pedido:", err);
        alert("Ocorreu um erro. Tente novamente.");
    }
}

// FINALIZAR
async function finalizar(pedidoId, clienteId) {
    if (!confirm("Deseja marcar este pedido como 'Finalizado' e notificar o cliente?")) return;

    try {
        // 1. Atualizar o status do pedido
        await fetch(`http://localhost:3000/pedidos/${pedidoId}/status`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: "Finalizado" })
        });

        // 2. Enviar mensagem para o cliente
        await fetch(`http://localhost:3000/mensagens`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                pedido_id: pedidoId,
                cliente_id: clienteId,
                mensagem: "Seu pedido foi finalizado! Agradecemos a preferência.",
                tipo: "admin"
            })
        });

        alert("Status alterado e cliente notificado!");
        carregarPedidos();

    } catch (err) {
        console.error("Erro ao finalizar pedido:", err);
        alert("Ocorreu um erro. Tente novamente.");
    }
}

// Função para capitalizar a primeira letra
function capitalize(s) {
    if (typeof s !== 'string') return ''
    return s.charAt(0).toUpperCase() + s.slice(1)
}

// ALTERAR
async function alterarPedido(id, dados) {

    await fetch(
        `http://localhost:3000/pedidos/${id}`,
        {
            method:"PUT",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(dados)
        }
    )

    carregarPedidos()
}

// REMOVER
async function remover(id) {

    if (!confirm("Deseja remover este pedido?")) return

    await fetch(
        `http://localhost:3000/pedidos/${id}`,
        {
            method:"DELETE"
        }
    )

    carregarPedidos()
}

// INIT
carregarPedidos()

// AUTO UPDATE
setInterval(carregarPedidos, 5000)

</script>

</body>
</html>
