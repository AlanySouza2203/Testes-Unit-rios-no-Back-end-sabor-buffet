<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Sabor & Arte</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #0d0d0d;
            color: white;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #0a0a0a;
            padding: 30px 20px;
            height: 100vh;
            border-right: 1px solid rgba(212, 167, 98, 0.3);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
        }

        .logo {
            font-size: 22px;
            margin-bottom: 40px;
            font-weight: bold;
            text-align: center;
            color: #fff;
            letter-spacing: 1px;
        }

        .logo span {
            color: #d4a762;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #aaa;
            text-decoration: none;
            margin: 6px 0;
            padding: 13px 16px;
            border-radius: 10px;
            transition: 0.25s;
            font-size: 15px;
        }

        .sidebar a:hover {
            background: rgba(212, 167, 98, 0.12);
            color: #d4a762;
        }

        .sidebar a.ativo {
            background: rgba(212, 167, 98, 0.18);
            color: #d4a762;
            font-weight: 600;
        }

        /* ÁREA PRINCIPAL */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* TOPBAR */
        .topbar {
            padding: 24px 36px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar h1 {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
        }

        .topbar p {
            color: #888;
            font-size: 14px;
            margin-top: 2px;
        }

        /* FILTROS */
        .filtros {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .filtro {
            border: 1px solid rgba(255,255,255,0.12);
            padding: 8px 18px;
            border-radius: 30px;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            transition: 0.25s;
            font-size: 13px;
        }

        .filtro:hover {
            border-color: #d4a762;
            color: #d4a762;
        }

        .filtro.ativo {
            background: #d4a762;
            border-color: #d4a762;
            color: #000;
            font-weight: 700;
        }

        /* CONTEÚDO DO MENU */
        .menu-content {
            flex: 1;
            padding: 32px 36px;
            overflow-y: auto;
        }

        /* CARDS GRID */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        /* CARD */
        .card {
            background: #181818;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            border-color: rgba(212, 167, 98, 0.3);
        }

        .card-img-wrapper {
            width: 100%;
            height: 180px;
            overflow: hidden;
            position: relative;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.06);
        }

        .card-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #d4a762;
            color: #000;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-body {
            padding: 18px 20px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-categoria {
            font-size: 11px;
            color: #d4a762;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card-nome {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 13px;
            color: #888;
            line-height: 1.5;
            flex: 1;
            margin-bottom: 14px;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-preco {
            font-size: 20px;
            font-weight: 800;
            color: #d4a762;
        }

        .card-preco span {
            font-size: 13px;
            font-weight: 400;
            color: #777;
        }

        .btn-adicionar {
            background: #d4a762;
            color: #000;
            border: none;
            padding: 9px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-adicionar:hover {
            background: #d4a762;
            transform: scale(1.04);
        }

        .btn-adicionar.adicionado {
            background: #2d7a3a;
            color: #fff;
        }

        /* CARRINHO */
        .cart {
            width: 320px;
            background: #0f0f0f;
            border-left: 1px solid rgba(212, 167, 98, 0.25);
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .cart-titulo {
            font-size: 18px;
            font-weight: 700;
            color: #d4a762;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .cart-subtitulo {
            font-size: 13px;
            color: #666;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .cart-vazio {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 14px;
            gap: 10px;
        }

        .cart-vazio i {
            font-size: 36px;
            color: #2a2a2a;
        }

        #lista {
            flex: 1;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            gap: 8px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-nome {
            font-size: 14px;
            color: #ddd;
            font-weight: 600;
        }

        .cart-item-qtd {
            font-size: 12px;
            color: #777;
            margin-top: 2px;
        }

        .cart-item-preco {
            font-size: 14px;
            font-weight: 700;
            color: #d4a762;
            white-space: nowrap;
        }

        .btn-remover {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: 0.2s;
        }

        .btn-remover:hover {
            color: #e55;
        }

        .cart-total {
            padding-top: 16px;
            border-top: 1px solid rgba(212, 167, 98, 0.3);
            margin-top: 8px;
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #888;
        }

        .cart-total-principal {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin: 12px 0 20px;
        }

        .cart-total-principal span:last-child {
            color:#d4a762;
        }

        .btn-confirmar {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4a762, #c99700);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 0.3px;
        }

        .btn-confirmar:hover {
            background: linear-gradient(135deg, #e8bf7a, #d4a762);
            transform: translateY(-1px);
        }

        .btn-confirmar:disabled {
            background: #2a2a2a;
            color: #555;
            cursor: not-allowed;
            transform: none;
        }

        /* PORÇÃO TAG */
        .porcao-info {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        /* =========================
   RESPONSIVIDADE
========================= */

/* TABLET */
@media (max-width: 1024px) {

    .container {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 18px 20px;
    }

    .sidebar a {
        margin: 0;
        font-size: 14px;
        padding: 10px 14px;
    }

    .main {
        width: 100%;
    }

    .cart {
        width: 100%;
        height: auto;
        position: relative;
        border-left: none;
        border-top: 1px solid rgba(212, 167, 98, 0.25);
    }

    .cards {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
}


/* CELULAR */
@media (max-width: 768px) {

    .topbar {
        padding: 20px;
    }

    .topbar h1 {
        font-size: 22px;
    }

    .topbar p {
        font-size: 13px;
    }

    .menu-content {
        padding: 20px;
    }

    .cards {
        grid-template-columns: 1fr;
        gap: 18px;
    }

    .card-img-wrapper {
        height: 200px;
    }

    .card-footer {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
    }

    .btn-adicionar {
        width: 100%;
        justify-content: center;
    }

    .cart {
        padding: 20px;
    }

    .filtros {
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 5px;
    }

    .filtros::-webkit-scrollbar {
        height: 4px;
    }

    .filtros::-webkit-scrollbar-thumb {
        background: #d4a762;
        border-radius: 10px;
    }

    .filtro {
        white-space: nowrap;
        flex-shrink: 0;
    }

    .sidebar {
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
    }

    .logo {
        margin-bottom: 10px;
    }
}


/* CELULARES PEQUENOS */
@media (max-width: 480px) {

    .topbar {
        padding: 16px;
    }

    .menu-content {
        padding: 16px;
    }

    .card-body {
        padding: 16px;
    }

    .card-nome {
        font-size: 16px;
    }

    .card-preco {
        font-size: 18px;
    }

    .btn-confirmar {
        font-size: 14px;
        padding: 12px;
    }

}
    </style>
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">Sabor & <span>Arte</span></div>

        <a href="index.html" class="ativo">
            <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="pacotes.html">
            <i class="fa-solid fa-box-open"></i> Pacotes
        </a>
        <a href="#" onclick="sair()">
            <i class="fa-solid fa-right-from-bracket"></i> Sair
        </a>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div class="topbar">
            <h1>Cardápio</h1>
            <p>Selecione os pratos que farão parte do seu evento</p>

           <div class="filtros">
    <button class="filtro ativo" data-categoria="todos">
        Todos
    </button>

    <button class="filtro" data-categoria="entrada">
        Entradas
    </button>

    <button class="filtro" data-categoria="principal">
        Pratos Principais
    </button>

    <button class="filtro" data-categoria="cafe">
        Café da manhã
    </button>

    <button class="filtro" data-categoria="sobremesa">
        Sobremesas
    </button>

    <button class="filtro" data-categoria="bebida">
        Bebidas
    </button>
</div>
        </div>

        <div class="menu-content">
            <div class="cards" id="cards-container"></div>
        </div>
    </div>

    <!-- CARRINHO -->
    <div class="cart">
        <div class="cart-titulo">Seu Pedido</div>
        <div class="cart-subtitulo" id="cart-subtitulo">0 itens selecionados</div>

        <div id="lista">
            <div class="cart-vazio" id="cart-vazio">
                <i class="fa-solid fa-plate-wheat"></i>
                <span>Nenhum item adicionado</span>
            </div>
        </div>

        <div class="cart-total" id="cart-total" style="display:none;">
            <div class="cart-total-principal">
                <span>Total</span>
                <span>R$ <span id="total">0,00</span></span>
            </div>
            <a href="confirpedi.html">
                <button class="btn-confirmar" id="btn-confirmar">
    <i class="fa-solid fa-check"></i>
    Confirmar Pedido
</button>
            </a>
        </div>

        <button class="btn-confirmar" id="btn-confirmar-vazio" disabled style="margin-top:auto;">
            Adicione itens ao pedido
        </button>
    </div>

</div>

<script>

// ============================
// VERIFICAR LOGIN
// ============================

function verificarLogin() {

    const usuario = localStorage.getItem("usuario");
    const clienteId = localStorage.getItem("clienteId");

    if (!usuario || !clienteId) {

        alert("Você precisa estar logado e cadastrado para continuar.");

        window.location.href = "login.html";

        return false;
    }

    return true;
}
const clienteId = localStorage.getItem("clienteId");
const usuarioSalvo = localStorage.getItem("usuario");
const eventoId = localStorage.getItem("eventoId");

const usuario = usuarioSalvo
    ? JSON.parse(usuarioSalvo)
    : null;

if (!eventoId) {
    alert("Crie um evento primeiro!");
    window.location.href = "evento.html";
}



// ============================
// ESTADO
// ============================

let carrinho = [];
let categoriaAtiva = "todos";
let itensCardapio = [];

const chaveCarrinho = `carrinho_${usuario.email}`;


// ============================
// CARREGAR CARDÁPIO DO BACKEND
// ============================

async function carregarCardapio(categoria = "todos") {

    try {

        let url = "http://localhost:3000/itens";

        if(categoria !== "todos"){
            url += `?categoria=${categoria}`;
        }

        const resposta = await fetch(url);

        itensCardapio = await resposta.json();

        renderCards();

    } catch(erro){

        console.log("Erro ao carregar cardápio", erro);

        document.getElementById("cards-container").innerHTML=`
        <h2>Erro ao carregar itens</h2>
        `;
    }

}


// ============================
// RENDER CARDS
// ============================

function renderCards(){

const container=document.getElementById("cards-container");

container.innerHTML="";


itensCardapio.forEach(item=>{

const existe=carrinho.find(i=>i.nome===item.nome);

container.innerHTML +=`

<div class="card">

<div class="card-img-wrapper">

<img src="${item.imagem || 'https://via.placeholder.com/400'}">

${item.destaque ? 
'<span class="card-badge">Destaque</span>'
:''}

</div>


<div class="card-body">

<div class="card-categoria">
${item.categoria}
</div>

<div class="card-nome">
${item.nome}
</div>

<div class="card-desc">
${item.descricao || ""}
</div>


<div class="porcao-info">
${item.porcao || ""}
</div>


<div class="card-footer">

<div class="card-preco">
R$ ${Number(item.valor).toFixed(2).replace(".",",")}
</div>


<button
class="btn-adicionar ${existe ? 'adicionado':''}"

onclick="adicionar(
'${item.nome}',
${item.valor},
'${item.porcao || ""}',
'${item.imagem || ""}'
)"

>

${existe
?'<i class="fa-solid fa-check"></i> Adicionado'
:'<i class="fa-solid fa-plus"></i> Adicionar'
}

</button>

</div>
</div>
</div>
`;

});

}


// ============================
// ADICIONAR AO CARRINHO
// ============================

function adicionar(nome, preco, porcao, imagem) {

    const usuario = localStorage.getItem("usuario");
    const clienteId = localStorage.getItem("clienteId");

    if (!usuario || !clienteId) {

        alert("Faça login para adicionar itens.");

        window.location.href = "login.html";

        return;
    }

    const itemExistente = carrinho.find(i => i.nome === nome);

    if (itemExistente) {
        itemExistente.qtd++;
    } else {
        carrinho.push({
            id: Date.now(),
            nome,
            preco,
            porcao,
            imagem,
            qtd: 1
        });
    }

    salvarCarrinho();
    renderCards();
    renderCarrinho();
}


// ============================
// REMOVER
// ============================

function remover(index){

carrinho.splice(index,1);

salvarCarrinho();

renderCarrinho();

renderCards();

}


// ============================
// RENDER CARRINHO
// ============================

function renderCarrinho(){

const lista=
document.getElementById("lista");

const totalElemento=
document.getElementById("total");

const subtitulo=
document.getElementById("cart-subtitulo");

const vazio=
document.getElementById("btn-confirmar-vazio");

const cartTotal=
document.getElementById("cart-total");


lista.innerHTML="";

let total=0;

let totalItens=0;


if(carrinho.length===0){

lista.innerHTML=`

<div class="cart-vazio">

<i class="fa-solid fa-plate-wheat"></i>

<span>Nenhum item adicionado</span>

</div>

`;

cartTotal.style.display="none";

vazio.style.display="block";

subtitulo.innerHTML=
"0 itens selecionados";

return;

}


vazio.style.display="none";

cartTotal.style.display="block";


carrinho.forEach((item,index)=>{

let subtotal=
item.preco*item.qtd;

total+=subtotal;

totalItens+=item.qtd;


lista.innerHTML+=`

<div class="cart-item">

<div class="cart-item-info">

<div class="cart-item-nome">

${item.nome}

</div>

<div class="cart-item-qtd">

${item.qtd}x • ${item.porcao}

</div>

</div>


<div class="cart-item-preco">

R$ ${subtotal.toFixed(2).replace(".",",")}

</div>


<button
class="btn-remover"
onclick="remover(${index})"
>

<i class="fa-solid fa-xmark"></i>

</button>

</div>

`;

});


subtitulo.innerHTML=
`${totalItens} item(s) selecionado(s)`;


totalElemento.innerHTML=
total.toFixed(2).replace(".",",");

}


// ============================
// FILTROS
// ============================

document.querySelectorAll(".filtro")
.forEach(btn=>{

btn.addEventListener("click",()=>{

document
.querySelectorAll(".filtro")
.forEach(b=>
b.classList.remove("ativo")
);

btn.classList.add("ativo");

categoriaAtiva=
btn.dataset.categoria;

carregarCardapio(categoriaAtiva);

});

});


// ============================
// SALVAR CARRINHO
// ============================

function salvarCarrinho(){

localStorage.setItem(
chaveCarrinho,
JSON.stringify(carrinho)
);

}


function carregarCarrinhoSalvo(){

const dados=
localStorage.getItem(chaveCarrinho);

if(dados){

carrinho=
JSON.parse(dados);

renderCarrinho();

}

}


// ============================
// CONFIRMAR PEDIDO
// ============================

function irPagamento() {

    const usuario = localStorage.getItem("usuario");
    const clienteId = localStorage.getItem("clienteId");

    if (!usuario || !clienteId) {

        alert("Faça login para continuar.");

        window.location.href = "login.html";

        return;
    }

    if (carrinho.length === 0) {

        alert("Carrinho vazio!");

        return;
    }

    let total = carrinho.reduce(
        (acc, item) => acc + (item.preco * item.qtd),
        0
    );

    let pedido = {

        cliente: JSON.parse(usuario).nome,

        eventoId,

        itens: carrinho,

        total,

        status: "Pendente"

    };

    localStorage.setItem(
        "pedidoAtual",
        JSON.stringify(pedido)
    );

    window.location.href = "confirpedi.html";
}

// botão confirmar

document.getElementById("btn-confirmar").addEventListener("click", (e) => {

    e.preventDefault();

    const usuario = localStorage.getItem("usuario");
    const clienteId = localStorage.getItem("clienteId");

    if (!usuario || !clienteId) {

        alert("Faça login para continuar.");

        window.location.href = "login.html";

        return;
    }

    irPagamento();
});

// ============================
// SAIR
// ============================

function sair(){

localStorage.clear();

window.location.href=
"login.html";

}


// ============================
// INICIALIZAÇÃO
// ============================

carregarCardapio();

carregarCarrinhoSalvo();

</script>

</body>
</html>
