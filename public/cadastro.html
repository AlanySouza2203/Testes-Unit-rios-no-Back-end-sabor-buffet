<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Buffet</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(to bottom right, #eef2ff, #f3f4f6);
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 20px;
      text-align: left;
    }


    header h1 {
      font-size: 36px;
      color: #1e3c72;
      margin-bottom: 10px;
      font-weight: bold;
    }

    header h2 {
      font-size: 22px;
      color: #555;
      margin-bottom: 15px;
      font-weight: 500;
    }

    header h1 {
      font-size: 36px;
      font-weight: 700;
      color: #1f2937;
    }



    .card {
      margin-top: 30px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
    }

    .tab {
      flex: 1;
      padding: 18px;
      background: #f9fafb;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 500;
      color: #6b7280;
    }

    .tab.active {
      background: #2563eb;
      color: #fff;
    }

    .content {
      padding: 30px;
    }

    .top h2 {
      font-size: 22px;
      color: #1f2937;
    }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      border-top: 1px solid #e5e7eb;
      padding-top: 15px;
    }

    /* FORM */
    .form-card {
      margin-top: 20px;
      background: #f9fafb;
      padding: 25px;
      border-radius: 12px;
    }

    .form-card h3 {
      margin-bottom: 20px;
      color: #1f2937;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      font-size: 14px;
      margin-bottom: 5px;
      color: #374151;
    }

    .input-group input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      outline: none;
    }

    .input-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Sistema de Gestão de Buffet</h1>
      <h2>Controle clientes, eventos e serviços de forma prática</h2>

    </header>

    <div class="card">

      <div class="tabs">
        <button class="tab active">
          <i class="fa fa-users"></i>
          Clientes
        </button>

        <button class="tab">
          <i class="fa fa-calendar"></i>
          Eventos
        </button>
      </div>

      <div class="content">

        <div class="top">
          <h2>Clientes</h2>
        </div>

        <!-- FORM -->
        <div class="form-card">
          <h3>Cadastrar Cliente</h3>

          <form id="form" class="form">

            <div class="input-group">
              <label>Nome</label>
              <input type="text" id="nome" placeholder="Digite o nome" required>
            </div>

            <div class="input-group">
              <label>Telefone</label>
              <input type="text" id="telefone" placeholder="(61) 99999-9999" required>
            </div>

            <div class="input-group">
              <label>Email</label>
              <input type="email" id="email" placeholder="email@email.com" required>
            </div>

            <button type="submit" class="btn">
              <i class="fa fa-save"></i>
              Salvar Cliente
            </button>

          </form>
        </div>

      </div>
    </div>


    <footer>
      Sabor & Arte • Gestão inteligente para o seu buffet • 2026
    </footer>

  </div>
  <script>
    const form = document.getElementById("form");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const nome = document.getElementById("nome").value;

      // salva o nome do cliente
      localStorage.setItem("clienteNome", nome);

      // redireciona para eventos
      window.location.href = "eventos.html";
    });
  </script>
</body>

</html>
