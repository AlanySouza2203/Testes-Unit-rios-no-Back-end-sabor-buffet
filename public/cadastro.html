<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff;
}

/* CARD */
.container{
  width:100%;
  max-width:480px;
  padding:50px;
  border-radius:20px;
  background:#000;
  box-shadow:0 20px 60px rgba(0,0,0,0.2);
  text-align:center;
}

/* LOGO */
.logo{
  font-size:22px;
  font-weight:bold;
  margin-bottom:20px;
  color:#fff;
}

.logo span{
  color:#d4a762;
}

/* TITULO */
h1{
  font-size:30px;
  color:#fff;
  margin-bottom:10px;
}

.sub{
  color:#bbb;
  font-size:14px;
  margin-bottom:25px;
}

/* ABAS */
.tabs{
  display:flex;
  background:#222;
  border-radius:40px;
  margin-bottom:25px;
  overflow:hidden;
}

.tabs div{
  flex:1;
  padding:12px;
  cursor:pointer;
  color:#bbb;
}

.tabs .active{
  background:#d4a762;
  color:#000;
  font-weight:bold;
}

/* INPUT */
.input-box{
  margin-bottom:15px;
  position:relative;
}

.input-box i{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:#777;
}

.input-box input{
  width:100%;
  padding:14px 14px 14px 38px;
  border-radius:10px;
  border:1px solid #333;
  background:#111;
  color:#fff;
  outline:none;
}

.input-box input::placeholder{
  color:#777;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:30px;
  background:#d4a762;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
  transition:0.3s;
}

.btn:hover{
  background:#fff;
}

/* RODAPÉ */
.footer{
  margin-top:20px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">Sabor <span>& Arte</span></div>

  <h1>Criar sua conta</h1>
  <p class="sub">Cadastre-se para começar a planejar seu evento</p>

  <div class="tabs">
    <div onclick="irLogin()">Entrar</div>
    <div class="active">Cadastrar</div>
  </div>

  <form id="form">

    <div class="input-box">
      <i class="fa fa-user"></i>
      <input type="text" id="nome" placeholder="Nome completo" required>
    </div>

    <div class="input-box">
      <i class="fa fa-phone"></i>
      <input type="text" id="telefone" placeholder="Telefone" required>
    </div>

    <div class="input-box">
      <i class="fa fa-envelope"></i>
      <input type="email" id="email" placeholder="E-mail" required>
    </div>

    <div class="input-box">
      <i class="fa fa-lock"></i>
      <input type="password" id="senha" placeholder="Senha (mín. 6 caracteres)" required>
    </div>

    <button type="submit" class="btn">Criar minha conta</button>

  </form>

  <div class="footer">© 2026 Sabor & Arte</div>

</div>

<script>
function irLogin(){
  window.location.href = "login.html"
}

const form = document.getElementById("form");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const nome = document.getElementById("nome").value;
  const telefone = document.getElementById("telefone").value;
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  try {
    const resposta = await fetch("http://localhost:3000/usuarios", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ nome, telefone, email, senha })
    });

    const dados = await resposta.json();

    if (resposta.ok) {
      alert("Conta criada com sucesso!");

      //  pode salvar usuário se quiser
      localStorage.setItem("usuario", JSON.stringify(dados));

      //  redireciona pro login (melhor prática)
      window.location.href = "login.html";

    } else {
      alert(dados.erro);
    }

  } catch (erro) {
    alert("Erro ao cadastrar");
    console.log(erro);
  }
});
</script>

</body>
</html>
