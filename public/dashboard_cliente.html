<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor & Arte - Minha Conta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
        }

        .header {
            background: #0d0d0d;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 167, 98, 0.3);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        .logo span { color: #d4a762; }

        .menu {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        .menu a {
            color: #aaa;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .menu a:hover, .menu a.active {
            background: rgba(212, 167, 98, 0.15);
            color: #d4a762;
        }

        .badge {
            background: #d4a762;
            color: #000;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Cards de boas-vindas */
        .welcome-card {
            background: linear-gradient(135deg, #d4a762, #b8860b);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            color: #000;
            text-align: center;
        }
        .welcome-card h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        /* Cards de ação */
        .acoes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card-acao {
            background: #111;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            border: 1px solid #222;
            transition: 0.3s;
            cursor: pointer;
        }
        .card-acao:hover {
            transform: translateY(-5px);
            border-color: #d4a762;
        }
        .card-acao i {
            font-size: 48px;
            color: #d4a762;
            margin-bottom: 15px;
        }
        .card-acao h3 {
            margin-bottom: 10px;
        }
        .card-acao p {
            color: #888;
            font-size: 14px;
        }

        /* Lista de eventos existentes */
        .eventos-lista {
            margin-top: 30px;
        }
        .evento-card {
            background: #111;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #222;
        }
        .evento-info h3 {
            margin-bottom: 5px;
        }
        .evento-info p {
            color: #888;
            font-size: 13px;
        }
        .btn-eventos {
            background: #d4a762;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-mensagens {
            background: #222;
            color: #d4a762;
            border: 1px solid #d4a762;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 10px;
        }

        .sem-eventos {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        @media (max-width: 768px) {
            .menu span {
                display: none;
            }
            .evento-card {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">Sabor & <span>Arte</span></div>
    <nav class="menu">
        <a href="index.html" class="active">
            <i class="fas fa-home"></i> <span>Início</span>
        </a>
    
        <a href="meu_pedido.html">
             <i class="fas fa-file-invoice"></i> <span>Meu Pedido</span>
        </a>
        <a href="index.html" onclick="sair()">
            <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
        </a>
    </nav>
</header>

<div class="container">
    <!-- Card de boas-vindas dinâmico -->
    <div class="welcome-card" id="welcomeCard">
        <h1 id="welcomeTitle">Olá, <span id="nomeCliente">Cliente</span>!</h1>
        <p id="welcomeText">Vamos planejar seu evento especial?</p>
    </div>

    <!-- Ações principais -->
    <div class="acoes-grid">

    <div class="card-acao" onclick="criarNovoEvento()">
        <i class="fas fa-plus-circle"></i>
        <h3>Criar novo evento</h3>
        <p>Comece a planejar um novo evento do zero</p>
    </div>

    

</div>

    <!-- Seus eventos -->
    <h3><i class="fas fa-calendar-alt"></i> Seus eventos</h3>
    <div id="eventosContainer" class="eventos-lista">
        <div class="sem-eventos">
            <i class="fas fa-calendar-plus" style="font-size: 48px; margin-bottom: 15px;"></i>
            <p>Você ainda não tem nenhum evento</p>
            <button onclick="criarNovoEvento()" style="margin-top: 15px; background: #d4a762; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer;">
                <i class="fas fa-plus"></i> Criar meu primeiro evento
            </button>
        </div>
    </div>
</div>

<script>
    let clienteId = localStorage.getItem("clienteId");
    let usuario = JSON.parse(localStorage.getItem("usuario"));
    let eventos = [];

    // Verificar login
    if (!clienteId || !usuario) {
        window.location.href = "login.html";
    }

    document.getElementById("nomeCliente").innerText = usuario.nome || "Cliente";

    // Carregar eventos do cliente
    async function carregarEventos() {
        try {
            const response = await fetch(`http://localhost:3000/eventos?cliente_id=${clienteId}`);
            eventos = await response.json();
            
            if (!Array.isArray(eventos)) {
                eventos = [];
            }
            
            renderizarEventos();
            atualizarWelcomeMessage();
            
        } catch (error) {
            console.error("Erro ao carregar eventos:", error);
            eventos = [];
            renderizarEventos();
        }
    }

    // Renderizar lista de eventos
    function renderizarEventos() {
        const container = document.getElementById("eventosContainer");
        
        if (eventos.length === 0) {
            container.innerHTML = `
                <div class="sem-eventos">
                    <i class="fas fa-calendar-plus" style="font-size: 48px; margin-bottom: 15px;"></i>
                    <p> Você ainda não tem nenhum evento planejado</p>
                    <p style="font-size: 14px; margin-top: 5px;">Clique em "Criar novo evento" para começar!</p>
                    <button onclick="criarNovoEvento()" style="margin-top: 20px; background: #d4a762; border: none; padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: bold;">
                        <i class="fas fa-plus"></i> Criar meu primeiro evento
                    </button>
                </div>
            `;
            return;
        }
        
        container.innerHTML = eventos.map(evento => `
            <div class="evento-card">
                <div class="evento-info">
                    <h3>${evento.tipo || "Evento"} - ${formatarData(evento.data)}</h3>
                    <p><i class="fas fa-map-marker-alt"></i> ${evento.local || "Local não definido"}</p>
                    <p><i class="fas fa-users"></i> ${evento.convidados || 0} convidados</p>
                    <p><strong>Status:</strong> ${evento.status || "Planejado"}</p>
                </div>
            </div>
        `).join("");
    }

    // Atualizar mensagem de boas-vindas baseado se tem evento
    function atualizarWelcomeMessage() {
        const welcomeText = document.getElementById("welcomeText");
        const welcomeTitle = document.getElementById("welcomeTitle");
        
        if (eventos.length === 0) {
            welcomeTitle.innerHTML = ` Bem-vindo(a), <span id="nomeCliente">${usuario.nome || "Cliente"}</span>!`;
            welcomeText.innerHTML = " Vamos começar? Crie seu primeiro evento e planeje tudo com a gente!";
        } else {
            welcomeTitle.innerHTML = ` Olá, <span id="nomeCliente">${usuario.nome || "Cliente"}</span>!`;
            welcomeText.innerHTML = `Você tem ${eventos.length} evento(s) planejado(s). Acompanhe tudo por aqui!`;
        }
    }

    // Ações
    function criarNovoEvento() {
        // Verificar se já tem algum fluxo em andamento
        window.location.href = "pacotes.html";
    }
    
    function irParaMensagens() {
        window.location.href = "mensagens.html";
    }
    
    
    function verEvento(eventoId) {
        localStorage.setItem("eventoAtualId", eventoId);
        window.location.href = "detalhes-evento.html";
    }
    
    function verMensagensEvento(eventoId) {
        localStorage.setItem("eventoFiltro", eventoId);
        window.location.href = "mensagens.html";
    }
    
    function formatarData(data) {
        if (!data) return "Data não definida";
        return new Date(data).toLocaleDateString("pt-BR");
    }
    
    function sair() {
        localStorage.clear();
        window.location.href = "index.html";
    }
    
    // Carregar contagem de mensagens não lidas
    async function carregarNotificacoes() {
        try {
            const response = await fetch(`http://localhost:3000/cliente/mensagens/nao-lidas/count?cliente_id=${clienteId}`);
            const data = await response.json();
            
            const badge = document.getElementById("badgeMsg");
            if (data.total > 0) {
                badge.innerText = data.total;
                badge.style.display = "inline-flex";
            } else {
                badge.style.display = "none";
            }
        } catch (error) {
            console.error("Erro ao carregar notificações:", error);
        }
    }
    
    // Inicializar
    carregarEventos();
    carregarNotificacoes();
    setInterval(carregarNotificacoes, 15000);
</script>

</body>
</html>
