<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Confirmar Pedido</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e2e8f0;
    }

    /* HEADER PADRÃO Sabor & Arte */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .logo span {
      color: #facc15;
    }

    /* LAYOUT */
    .container {
      display: flex;
      min-height: 100vh;
    }

    .resumo {
      flex: 1;
      padding: 40px;
    }

    h1 {
      color: #facc15;
      margin-bottom: 25px;
    }

    .box {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid rgba(250, 204, 21, 0.2);
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #334155;
    }

    .total {
      font-size: 22px;
      margin-top: 20px;
      color: #facc15;
      font-weight: bold;
    }

    /* BOTÕES */
    .botoes {
      margin-top: 30px;
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .voltar {
      background: #334155;
      color: white;
    }

    .cancelar {
      background: #b91c1c;
      color: white;
    }

    .confirmar {
      background: #facc15;
      color: #000;
    }

    /* LATERAL */
    .lateral {
      width: 320px;
      background: #0f172a;
      border-left: 1px solid rgba(250, 204, 21, 0.3);
      padding: 25px;
    }

    .status {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      background: #facc15;
      color: #000;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .resumo {
        padding: 20px;
      }
      .lateral {
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(250, 204, 21, 0.3);
        padding: 20px;
      }
      .botoes {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!--  HEADER PADRÃO -->
  <div class="header">
    <div class="logo">Sabor <span>& Arte</span></div>
  </div>

  <div class="container">

    <!-- RESUMO -->
    <div class="resumo">

      <h1>Confirmar Pedido</h1>

      <div class="box">
        <h3>Cliente</h3>
        <p id="cliente">Carregando...</p>
      </div>

      <div class="box">
        <h3>Itens do Pedido</h3>
        <div id="itens"></div>
      </div>

    <div class="total">
  Total: <span id="total">R$ 0,00</span>
</div>
      <!-- BOTÕES -->
      <div class="botoes">

        <a href="cardapio.html" class="btn voltar">
  Alterar Pedido
</a>
        <button class="btn cancelar" onclick="cancelarPedido()">
          Cancelar
        </button>

        <button class="btn confirmar" onclick="confirmarPedido()">
          Confirmar
        </button>

      </div>

    </div>

    <!-- LATERAL -->
    <div class="lateral">

      <h3>Status</h3>

      <div class="status">
        <p><b>Situação:</b></p>
        <span class="badge" id="status">Pendente</span>
      </div>

      <div class="status">
        <p>Revise tudo antes de confirmar o buffet.</p>
      </div>

    </div>

  </div>

  <script>
    const usuarioSalvo = localStorage.getItem("usuario");
const clienteId = localStorage.getItem("clienteId");

if (!usuarioSalvo || !clienteId) {

    alert("Você precisa estar logado e cadastrado para confirmar um pedido.");

    window.location.href = "login.html";
}


//  PEGAR PEDIDO
let pedido = JSON.parse(localStorage.getItem("pedidoAtual"))

if (!pedido) {
  alert("Nenhum pedido encontrado!")
  window.location.href = "index.html"
}

// PEGAR PACOTE
let pacote = JSON.parse(localStorage.getItem("pacote"))

if (!pacote) {
  alert("Selecione um pacote primeiro!")
  window.location.href = "pacotes.html"
}

let pacoteNome = pacote.nome
let pacoteValor = Number(pacote.preco)

// CLIENTE
document.getElementById("cliente").innerText = pedido.cliente

// CRIAR BOX DO PACOTE
const resumo = document.querySelector(".resumo")

const pacoteBox = document.createElement("div")
pacoteBox.className = "box"
pacoteBox.innerHTML = `
  <h3>Pacote Selecionado</h3>
  <p>${pacoteNome}</p>
 <p><strong>${formatarMoeda(pacoteValor)}</strong></p>
`

resumo.insertBefore(pacoteBox, resumo.children[2])

//  ITENS
let container = document.getElementById("itens")
let totalItens = 0

pedido.itens.forEach(item => {
  let subtotal = item.preco * item.qtd
  totalItens += subtotal

  container.innerHTML += `
    <div class="item">
      <span>${item.nome} (${item.qtd}x)</span>
     <span>${formatarMoeda(subtotal)}</span>
    </div>
  `
})
function formatarMoeda(valor) {
  return valor.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

//  TOTAL FINAL
// GARANTIR NÚMEROS VÁLIDOS
pacoteValor = Number(pacoteValor) || 0;
totalItens = Number(totalItens) || 0;

// TOTAL FINAL
let totalFinal = pacoteValor + totalItens;

// DEBUG
console.log("pacoteValor:", pacoteValor);
console.log("totalItens:", totalItens);
console.log("totalFinal:", totalFinal);

// MOSTRAR TOTAL
document.getElementById("total").innerText =
  formatarMoeda(totalFinal);

//  CANCELAR
function cancelarPedido() {
  if (!confirm("Deseja cancelar o pedido?")) return

  localStorage.removeItem("pedidoAtual")
  localStorage.removeItem("pacote")

  alert("Pedido cancelado com sucesso!")
  window.location.replace("/index.html")
}

//  CONFIRMAR → SEM TRAVAR (MESMO COM ERRO NO SERVIDOR)
async function confirmarPedido() {

  const eventoId = localStorage.getItem("eventoId");
  const clienteId = Number(localStorage.getItem("clienteId"));

  console.log("ITENS DO PEDIDO:");
  console.table(pedido.itens);

  // ITENS PARA O ORÇAMENTO
  const itensOrcamento = pedido.itens.map(item => ({
    item_servico_id: Number(item.id),
    quantidade: Number(item.qtd),
    valor: Number(item.preco)
  }));

  console.log("ITENS ENVIADOS PARA ORÇAMENTO:");
  console.table(itensOrcamento);

  // ITENS PARA O PEDIDO (manter estrutura original)
  const itensPedido = pedido.itens.map(item => ({
    id: Number(item.id),
    nome: item.nome,
    qtd: Number(item.qtd),
    preco: Number(item.preco)
  }));

  const pedidoFinal = {
    cliente_id: clienteId,
    evento_id: Number(eventoId),
    admin_id: 1,
    itens: itensPedido,  
    total: totalFinal,
    metodo_pagamento: null
  };

  try {

    // =========================
    // SALVAR PEDIDO
    // =========================

    const resPedido = await fetch(
      "http://localhost:3000/pedidos",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(pedidoFinal)
      }
    );

    const dataPedido = await resPedido.json();

    if (!resPedido.ok) {
      alert(dataPedido.erro || "Erro ao salvar pedido");
      return;
    }

    console.log(" Pedido salvo:", dataPedido);

    // =========================
    // CRIAR ORÇAMENTO AUTOMÁTICO
    // =========================

    const orcamento = {
      evento_id: Number(eventoId),
      admin_id: 1,
      valor_total: totalFinal,
      itens: itensOrcamento,  
      status: "pendente",
      status_pagamento: "pendente"
    };
    

    console.log(" Criando orçamento:", orcamento);

    const resOrcamento = await fetch(
      "http://localhost:3000/orcamentos",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(orcamento)
      }
    );

    const dataOrcamento = await resOrcamento.json();

    if (!resOrcamento.ok) {
      console.error("❌ Erro ao criar orçamento:", dataOrcamento);
      alert(dataOrcamento.erro || "Erro ao criar orçamento");
      return;
    }

    console.log(" Orçamento criado:", dataOrcamento);

    // =========================
    // SALVAR PARA PAGAMENTO
    // =========================

    const usuario =
      JSON.parse(localStorage.getItem("usuario")) || {};

    localStorage.setItem(
      "pedidoPagamento",
      JSON.stringify({
        ...pedidoFinal,
        id: dataPedido.id,
        orcamento_id: dataOrcamento.id,
        cliente:
          pedido.cliente ||
          usuario.nome ||
          "Cliente"
      })
    );

    alert("Pedido confirmado com sucesso!");

    window.location.href = "pagamento.html";

  } catch (erro) {

    console.error("❌ Erro geral:", erro);

    alert("Erro ao conectar com o servidor.");
  }
}



</script>

</body>
</html>
