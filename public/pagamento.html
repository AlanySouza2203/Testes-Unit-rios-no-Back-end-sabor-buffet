<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento - Sabor & Arte</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

:root{
 --preto:#0d0d0d;
 --branco:#fff;
 --cinza:#f5f5f5;
 --borda:#e6e6e6;
 --dourado:#d4a762;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:var(--cinza);
color:var(--preto);
}


/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 10%;
background:rgba(0,0,0,.6);
backdrop-filter:blur(10px);
position:absolute;
width:100%;
top:0;
z-index:100;
}

.logo{
font-size:32px;
font-weight:bold;
color:white;
}

.logo span{
color:var(--dourado);
}

.seguro{
background:var(--dourado);
padding:8px 18px;
border-radius:20px;
font-weight:bold;
}


/* LAYOUT */

.wrapper{
padding:120px 60px 60px;
display:flex;
justify-content:center;
}

.container{
width:95%;
max-width:1600px;
display:flex;
gap:40px;
}

.left{
flex:2;
}

.right{
flex:1;
background:white;
padding:30px;
border-radius:18px;
}


/* METODOS */

.metodos{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.metodo{
background:white;
border:1px solid var(--borda);
padding:20px;
border-radius:16px;
text-align:center;
cursor:pointer;
transition:.3s;
}

.metodo:hover{
transform:translateY(-4px);
}

.metodo small{
display:block;
margin-top:8px;
color:#777;
}

.ativo{
border:2px solid var(--dourado);
background:#fff8e6;
}


/* BOX */

.box{
background:white;
padding:25px;
border-radius:16px;
margin-top:25px;
border:1px solid var(--borda);
}

.hidden{
display:none;
}


/* INPUTS */

input,
select{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
border:1px solid #ddd;
}

.row{
display:flex;
gap:10px;
}


/* PIX */

.pix-box{
text-align:center;
}

.qr{
width:180px;
height:180px;
background:#ddd;
margin:20px auto;
border-radius:10px;
}


/* RESUMO */

.resumo div{
display:flex;
justify-content:space-between;
margin:12px 0;
}

.total{
margin-top:20px;
font-size:28px;
font-weight:bold;
color:var(--dourado);
}


/* BOTAO */

button{
width:100%;
padding:15px;
margin-top:25px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(
135deg,
#e6b422,
#c99700
);
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.metodos{
grid-template-columns:repeat(2,1fr);
}

}

</style>
</head>

<body>

<header>

<div class="logo">
Sabor & <span>Arte</span>
</div>

<div class="seguro">
<i class="bi bi-lock-fill"></i>
Pagamento Seguro
</div>

</header>


<div class="wrapper">

<div class="container">


<!-- ESQUERDA -->

<div class="left">

<h2>Forma de pagamento</h2>

<p style="margin:10px 0 25px;color:#777">
Escolha como deseja pagar
</p>


<div class="metodos">

<div class="metodo ativo"
onclick="selecionar(event,'credito')">

Crédito
<small>Até 12x</small>

</div>


<div class="metodo"
onclick="selecionar(event,'debito')">

Débito
<small>Imediato</small>

</div>


<div class="metodo"
onclick="selecionar(event,'pix')">

PIX
<small>Instantâneo</small>

</div>

</div>



<!-- CREDITO -->

<div id="credito" class="box">

<input placeholder="Nome no cartão">

<input placeholder="Número do cartão">

<div class="row">

<input placeholder="MM/AA">

<input placeholder="CVV">

</div>

<select id="parcelas"></select>

</div>



<!-- DEBITO -->

<div id="debito"
class="box hidden">

<input placeholder="Nome no cartão">

<input placeholder="Número do cartão">

<div class="row">

<input placeholder="MM/AA">

<input placeholder="CVV">

</div>

<p style="margin-top:15px;color:#777">
O valor será debitado imediatamente
</p>

</div>



<!-- PIX -->

<div id="pix"
class="box hidden pix-box">

<div class="qr"></div>

<p>Escaneie o QRCode</p>

<div class="row">

<input
value="saborarte@pix.com.br"
readonly>

<button
type="button"
onclick="copiar()">

Copiar

</button>

</div>

</div>

</div>



<!-- DIREITA -->

<div class="right">

<h3>Resumo do pedido</h3>

<div class="resumo">

<div>
<span>Cliente</span>
<span id="clienteResumo">---</span>
</div>

<div>
<span>Itens</span>
<span id="itensResumo">0</span>
</div>

<div class="total">
<span>Total</span>
<span id="totalResumo">
R$0,00
</span>
</div>

</div>

<button onclick="confirmar()">
Confirmar pagamento
</button>

</div>

</div>

</div>


<script>
    function formatarMoeda(valor) {
  return valor.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

const pedidoPagamento=
JSON.parse(
localStorage.getItem(
"pedidoPagamento"
)
)

if(!pedidoPagamento){

alert(
"Nenhum pedido encontrado"
)

window.location.href=
"index.html"

}


// resumo

clienteResumo.innerText=
pedidoPagamento.cliente

itensResumo.innerText=
pedidoPagamento.itens.length

totalResumo.innerText =
formatarMoeda(
  Number(pedidoPagamento.total)
)

// parcelas

const total=
Number(
pedidoPagamento.total
)

const select=
document.getElementById(
"parcelas"
)

for(let i=1;i<=12;i++){

let valor=
(total/i)

select.innerHTML+=`

<option>
  ${i}x de ${formatarMoeda(valor)}
  sem juros
</option>

`

}



// trocar forma pagamento

function selecionar(
event,
id
){

document
.querySelectorAll(
".metodo"
)
.forEach(el=>{

el.classList.remove(
"ativo"
)

})

event
.currentTarget
.classList.add(
"ativo"
)


document
.querySelectorAll(
"#credito,#debito,#pix"
)
.forEach(el=>{

el.classList.add(
"hidden"
)

})

document
.getElementById(id)
.classList.remove(
"hidden"
)

}



// copiar pix

function copiar(){

const valor=
document.querySelector(
"#pix input"
).value

navigator
.clipboard
.writeText(valor)

alert(
"PIX copiado!"
)

}



// confirmar

async function confirmar(){

document.body.innerHTML=`

<div
style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family:Arial;
">

<h1 style="
color:green">

<i class="bi bi-check-circle-fill"></i>

Pagamento aprovado

</h1>

<p>

Obrigado pela preferência

</p>

</div>

`

localStorage.removeItem(
"pedidoPagamento"
)

localStorage.removeItem(
"pedidoAtual"
)


setTimeout(()=>{

window.location.href=
"index.html"

},3000)

}

</script>

</body>
</html>
