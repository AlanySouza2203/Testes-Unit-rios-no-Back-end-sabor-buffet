<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabor & Arte Buffet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
:root{
  --dourado:#d4a762;
  --cinza:#f3f4f6;
}

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI", sans-serif;
}

body{
  background:var(--cinza);
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:25px 8%;
  background:rgba(0,0,0,0.9);
  backdrop-filter:blur(10px);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:26px;
  font-weight:bold;
  color:#fff;
}

.logo span{
  color:var(--dourado);
}

.seguro{
  background:var(--dourado);
  color:#000;
  padding:10px 18px;
  border-radius:25px;
  font-weight:bold;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:20px;
  padding:40px;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.descricao{
  color:#6b7280;
  font-size:18px;
  margin-bottom:25px;
}

label{
  font-size:16px;
  font-weight:600;
  margin-bottom:10px;
  display:block;
}

/* TIPOS */
.tipos{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  margin-bottom:20px;
}

.tipo{
  padding:14px 22px;
  font-size:15px;
  border-radius:12px;
  border:1px solid #ddd;
  background:#f9fafb;
  cursor:pointer;
}

.tipo.active{
  background:#fde68a;
  border-color:#f59e0b;
  font-weight:600;
}

/* INPUT */
.input{
  width:100%;
  padding:16px;
  font-size:15px;
  border-radius:12px;
  border:1px solid #ddd;
  margin-bottom:25px;
}

/* RANGE */
.range-label{
  font-size:16px;
  margin-bottom:10px;
}

.range{
  width:100%;
  margin-bottom:30px;
}

/* BOTÕES */
.acoes{
  display:flex;
  justify-content:space-between;
}

.btn-voltar{
  background:#e5e7eb;
  padding:14px 25px;
  border:none;
  border-radius:12px;
  cursor:pointer;
}

.btn-continuar{
  background:linear-gradient(135deg,#e6b422,#c99700);
  padding:16px 35px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}
/* =========================
   RESPONSIVIDADE
========================= */

/* TABLET */
@media (max-width: 1024px){

  header{
    padding:20px 5%;
  }

  .container{
    margin:30px auto;
  }

  .card{
    padding:35px;
  }

}


/* CELULAR */
@media (max-width: 768px){

  header{
    flex-direction:column;
    gap:15px;
    text-align:center;
    padding:20px;
  }

  .logo{
    font-size:24px;
  }

  .seguro{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
  }

  .container{
    margin:20px auto;
    padding:0 15px;
  }

  .card{
    padding:25px 20px;
    border-radius:16px;
  }

  .descricao{
    font-size:16px;
    line-height:1.5;
  }

  .tipos{
    gap:10px;
  }

  .tipo{
    flex:1 1 calc(50% - 10px);
    text-align:center;
    padding:14px 10px;
    font-size:14px;
  }

  .input{
    padding:14px;
    font-size:14px;
  }

  .acoes{
    flex-direction:column;
    gap:15px;
  }

  .btn-voltar,
  .btn-continuar{
    width:100%;
    padding:15px;
    font-size:15px;
  }

}


/* CELULARES PEQUENOS */
@media (max-width: 480px){

  header{
    padding:18px 14px;
  }

  .logo{
    font-size:22px;
  }

  .card{
    padding:22px 16px;
  }

  .descricao{
    font-size:15px;
  }

  label{
    font-size:15px;
  }

  .tipo{
    flex:1 1 100%;
    font-size:13px;
    border-radius:10px;
  }

  .input{
    border-radius:10px;
  }

  .btn-voltar,
  .btn-continuar{
    border-radius:10px;
    font-size:14px;
  }

}
</style>
</head>

<body>

<header>
  <div class="logo">Sabor & <span>Arte</span></div>
  <div class="seguro">
    <i class="bi bi-lock-fill"></i> Pagamento Seguro
</div>
</header>

<div class="container">

  <div class="card">

    <p class="descricao">Preencha as informações do seu evento.</p>

    <!-- TIPOS -->
    <label>Tipo de evento</label>
    <div class="tipos">
      <button class="tipo active">Casamento</button>
      <button class="tipo">Aniversário</button>
      <button class="tipo">Corporativo</button>
      <button class="tipo">Formatura</button>
      <button class="tipo">Batizado</button>
      <button class="tipo">Outro</button>
    </div>

    <!-- OUTRO -->
    <div id="campoOutro" style="display:none;">
      <label>Qual o tipo de evento?</label>
      <input type="text" id="outroInput" class="input">
    </div>

    <!-- DATA -->
    <label>Data do evento</label>
    <input type="date" id="data" class="input">

    <!--  LOCAL DO EVENTO (NOVO) -->
    <label>Local do evento</label>
    <input type="text" id="local" class="input" placeholder="Ex: Buffet, Salão, Casa, Fazenda...">

    <!-- QUANTIDADE DE CONVIDADOS -->
<label>Quantidade de convidados</label>

<input 
type="number" 
id="convidados" 
class="input"
placeholder="Ex: 150"
min="1">

    <!-- AÇÕES -->
    <div class="acoes">
      <button class="btn-voltar">Voltar</button>
      <button id="continuar" class="btn-continuar">Continuar →</button>
    </div>

  </div>

</div>

<script>

// proteção fluxo
const pacoteSalvo = JSON.parse(localStorage.getItem("pacote"));

if (!pacoteSalvo) {
  alert("Selecione um pacote primeiro");
  window.location.href = "pacotes.html";
}

// proteção login
if (!localStorage.getItem("clienteId")) {
  alert("Faça login para continuar");
  window.location.href = "login.html";
}

let tipoSelecionado = "Casamento";


// seleção tipo
document.querySelectorAll(".tipo").forEach(btn => {

  btn.addEventListener("click", (e) => {

    e.preventDefault();

    document.querySelectorAll(".tipo")
    .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");

    tipoSelecionado = btn.innerText;

    const campoOutro =
      document.getElementById("campoOutro");

    if(tipoSelecionado==="Outro"){

      campoOutro.style.display="block";

      document
      .getElementById("outroInput")
      .focus();

    }else{

      campoOutro.style.display="none";

      document
      .getElementById("outroInput")
      .value="";
    }

  });

});

const convidados =
Number(
document.getElementById("convidados").value
);


// CONTINUAR
document.getElementById("continuar").addEventListener("click", async (e) => {

  e.preventDefault();

  const cliente_id = Number(localStorage.getItem("clienteId"));
  const data = document.getElementById("data").value;
  const local = document.getElementById("local").value.trim();
  const convidados = Number(document.getElementById("convidados").value) || 0; // ← ADICIONEI!

  if (!cliente_id) {
    return alert("Cliente inválido. Faça login novamente.");
  }

  if (!data) {
    return alert("Selecione a data");
  }

  if (!local) {
    return alert("Informe o local");
  }

  let tipoFinal = tipoSelecionado;

  if (tipoSelecionado === "Outro") {
    tipoFinal = document.getElementById("outroInput").value.trim();
    if (!tipoFinal) {
      return alert("Digite o tipo do evento");
    }
  }

  try {
    const resposta = await fetch("http://localhost:3000/eventos", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        cliente_id,
        tipo: tipoFinal,
        data,
        local,
        convidados,  // ← ADICIONADO!
        admin_id: 1  // ← ADICIONADO (admin padrão)
      })
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      console.log(dados);
      return alert(dados.erro || "Erro ao salvar");
    }

    localStorage.setItem("eventoId", dados.id);
    localStorage.setItem("eventoAtual", JSON.stringify({
      id: dados.id,
      tipo: tipoFinal,
      data,
      local,
      convidados
    }));

    alert("Evento criado com sucesso!");
    window.location.href = "cardapio.html";

  } catch (erro) {
    console.log(erro);
    alert("Erro ao conectar com o servidor");
  }

});

</script>


</body>
</html>
