<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Buffet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f1f3f6;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 20px;
      text-align: left;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 36px;
      color: #1e3c72;
      margin-bottom: 10px;
      font-weight: bold;
    }

    header h2 {
      font-size: 22px;
      color: #555;
      margin-bottom: 15px;
      font-weight: 500;
    }

    header h1 {
      font-size: 36px;
      font-weight: 700;
      color: #1f2937;
    }

    .form-card {
      margin-top: 20px;
      background: #f9fafb;
      padding: 25px;
      border-radius: 12px;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-card h3 {
      margin-bottom: 20px;
    }

    h1 {
      color: #1f2d3d;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #6c7a89;
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .tabs {
      display: flex;
    }

    .tab {
      flex: 1;
      padding: 15px;
      border: none;
      background: #eaeaea;
      cursor: pointer;
      font-weight: bold;
      color: #555;
    }

    .tab i {
      margin-right: 8px;
    }

    .tab.active {
      background: #2f5bd3;
      color: #fff;
    }

    /* Conteúdo */
    .content {
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h2 {
      color: #1f2d3d;
    }

    .btn {
      background: #2f5bd3;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn i {
      margin-right: 5px;
    }

    .btn:hover {
      background: #244bb0;
    }




    footer {
      margin-top: 30px;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      border-top: 1px solid #e5e7eb;
      padding-top: 15px;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }


    .input-group {
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      font-size: 14px;
      margin-bottom: 5px;
      color: #374151;
    }

    .input-group input,
    .input-group select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      outline: none;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
  </style>

</head>

<body>

  <div class="container">
    <header>
      <h1>Sistema de Gestão de Buffet</h1>
      <h2>Controle clientes, eventos e serviços de forma prática</h2>

    </header>

    <div class="card">


      <div class="tabs">
        <button class="tab active">
          <i class="fa fa-calendar"></i> Eventos
        </button>
        <button class="tab">
          <i class="fa fa-users"></i> Clientes
        </button>
      </div>


      <div class="content">
        <div class="header">
          <h2>Eventos</h2>
          <button class="btn">
            <i class="fa fa-plus"></i> Novo Evento
          </button>
        </div>

        <div class="form-card">
          <h3>Cadastrar Evento</h3>

          <form id="formEvento" class="form">

            <div class="input-group">
              <label>Cliente</label>
              <input type="text" id="cliente" placeholder="Nome do cliente">
            </div>

            <div class="input-group">
              <label>Tipo de Evento</label>
              <select id="tipo">
                <option>Casamento</option>
                <option>Aniversário</option>
                <option>Corporativo</option>
                <option>Outro</option>
              </select>
            </div>

            <div class="input-group">
              <label>Data</label>
              <input type="date" id="data">
            </div>

            <div class="input-group">
              <label>Local</label>
              <input type="text" id="local" placeholder="Local do evento">
            </div>

            <div class="input-group">
              <label>Número de Convidados</label>
              <input type="number" id="convidados" placeholder="Ex: 100">
            </div>

            <button class="btn">
              <i class="fa fa-save"></i>
              Salvar Evento
            </button>

          </form>
        </div>


      </div>

    </div>

    <footer>
      Sabor & Arte • Gestão inteligente para o seu buffet • 2026
    </footer>

  </div>

</body>

</html>
